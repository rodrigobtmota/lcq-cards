            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            DisplayMode: |-
              =If(
                  varBusyAuditoria || IsBlank(dpd_AuditoriaAberta.Selected.ID),
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =RGBA(3, 52, 162, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =45
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |-
              =If(
                  varBusyAuditoria,

                  Notify(
                      "⏳ Aguarde, o registro da auditoria já está em processamento.",
                      NotificationType.Information
                  ),

                  If(
                      IsBlank(dpd_AuditoriaAberta.Selected.ID) ||
                      IsBlank(varResultadoAuditoria) ||
                      IsBlank(Trim(txtDescricaoAchados.Text)) ||
                      IsBlank(Trim(txtEncaminhamento.Text)),

                      Notify(
                          "Selecione uma auditoria aberta e preencha os campos obrigatórios.",
                          NotificationType.Warning
                      ),

                      Set(varBusyAuditoria, true);
                      Set(varErroSalvarAuditoria, false);

                      IfError(
                          Patch(
                              AuditoriasPrograma,
                              dpd_AuditoriaAberta.Selected,
                              {
                                  ResponsavelAuditoria: {
                                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                      Claims: "i:0#.f|membership|" & Lower(Coalesce(varUserEmail, User().Email)),
                                      DisplayName: Coalesce(varUserNome, User().FullName),
                                      Email: Lower(Coalesce(varUserEmail, User().Email)),
                                      Department: "",
                                      JobTitle: "",
                                      Picture: ""
                                  },

                                  StatusAuditoria: {Value: "Concluída"},
                                  Resultado: {Value: varResultadoAuditoria},

                                  DescricaoAchados: txtDescricaoAchados.Text,
                                  Encaminhamento: txtEncaminhamento.Text,
                                  ImpactoSeguranca: togImpactoSeguranca.Value,
                                  PlanoAcaoGerado: togPlanoAcao.Value,
                                  DataConclusao: Now()
                              }
                          ),

                          Set(varErroSalvarAuditoria, true);
                          Set(varBusyAuditoria, false);
                          Notify(
                              "❌ Erro ao concluir a auditoria: " &
                              Coalesce(
                                  FirstError.Message,
                                  "verifique conexão, permissões ou as colunas da lista AuditoriasPrograma."
                              ),
                              NotificationType.Error
                          )
                      );

                      If(
                          !varErroSalvarAuditoria,

                          Notify(
                              "✅ Auditoria concluída com sucesso.",
                              NotificationType.Success
                          );

                          Reset(dpd_AuditoriaAberta);
                          Reset(togImpactoSeguranca);
                          Reset(togPlanoAcao);
                          Reset(txtDescricaoAchados);
                          Reset(txtEncaminhamento);
                          Set(varResultadoAuditoria, Blank());
                          Set(varBusyAuditoria, false);

                          Navigate(TelaInicio, ScreenTransition.Fade)
                      )
                  )
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            Size: =13
            Text: |-
              =If(
                  varBusyAuditoria,
                  "SALVANDO...",
                  "Salvar"
              )
            X: =1113
            Y: =681

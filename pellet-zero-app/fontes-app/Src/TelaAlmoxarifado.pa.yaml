                  - DataCard1_1:
                      Control: TypedDataCard@1.0.7
                      Variant: BlankCard
                      Properties:
                        BorderColor: =Color.Transparent
                        Fill: =RGBA(238, 238, 238, 1)
                        Height: =193
                        Width: =Parent.Width
                        X: =1
                        Y: =17
                      Children:
                        - Btn_Enviar_TelaAlmoxarifado:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =Color.White
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: |+
                                =// =======================================================
                                // TelaAlmoxarifado - BtnEnviar.DisplayMode (CORRETO)
                                // =======================================================
                                If(
                                    varBusy,
                                    DisplayMode.Disabled,
                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),

                                            IsBlank(DataCardValue120.Selected.Value),
                                            IsBlank(DataCardValue121.Selected.Value),
                                            IsBlank(DataCardValue122.Selected.Value),
                                            IsBlank(DataCardValue123.Selected.Value),
                                            IsBlank(DataCardValue124.Selected.Value),
                                            IsBlank(DataCardValue125.Selected.Value),
                                            IsBlank(DataCardValue126.Selected.Value)
                                        ),
                                        DisplayMode.Disabled,
                                        DisplayMode.Edit
                                    )
                                )
                              Fill: '=RGBA(0, 56, 168, 1) '
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =112
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(0, 90, 160, 1)
                              OnSelect: |-
                                =If(
                                    varBusy,
                                    Blank(),

                                    Set(varBusy, true);
                                    Set(varRodizioValidado, true);
                                    Set(varPreparacaoAlmoxarifadoOk, true);
                                    Set(varChecklistSemRodizioAtivo, false);

                                    Set(
                                        varRegistroChecklistAtualizadoAlmoxarifado,
                                        Defaults(Checklist_OrganizacaoPellet2025)
                                    );

                                    Clear(colRodizioSalaAtual);
                                    Clear(colNcAlmoxarifado);
                                    Clear(colNCtemporarias);

                                    Set(
                                        varPessoaLogadaSP,
                                        {
                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims: "i:0#.f|membership|" & Lower(Coalesce(varUserEmail, User().Email)),
                                            DisplayName: Coalesce(varUserNome, User().FullName),
                                            Email: Lower(Coalesce(varUserEmail, User().Email)),
                                            Department: "",
                                            JobTitle: "",
                                            Picture: ""
                                        }
                                    );

                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),
                                            IsBlank(DataCardValue120.Selected.Value),
                                            IsBlank(DataCardValue121.Selected.Value),
                                            IsBlank(DataCardValue122.Selected.Value),
                                            IsBlank(DataCardValue123.Selected.Value),
                                            IsBlank(DataCardValue124.Selected.Value),
                                            IsBlank(DataCardValue125.Selected.Value),
                                            IsBlank(DataCardValue126.Selected.Value)
                                        ),

                                        Notify(
                                            "❌ Preencha todos os campos obrigatórios.",
                                            NotificationType.Error
                                        );
                                        Set(varBusy, false),

                                        Set(
                                            varTemNC_Almoxarifado,
                                            Or(
                                                DataCardValue120.Selected.Value = "Não Conforme",
                                                DataCardValue121.Selected.Value = "Não Conforme",
                                                DataCardValue122.Selected.Value = "Não Conforme",
                                                DataCardValue123.Selected.Value = "Não Conforme",
                                                DataCardValue124.Selected.Value = "Não Conforme",
                                                DataCardValue125.Selected.Value = "Não Conforme",
                                                DataCardValue126.Selected.Value = "Não Conforme"
                                            )
                                        );

                                        ClearCollect(
                                            colNcAlmoxarifado,
                                            Filter(
                                                Table(
                                                    {
                                                        ItemChecklistOrigem: "MateriaisForaLugar",
                                                        ItemNC: "Materiais armazenados corretamente e em local adequado?",
                                                        Valor: DataCardValue120.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "CaixasNaoID",
                                                        ItemNC: "Caixas organizadas e identificadas?",
                                                        Valor: DataCardValue121.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "ReagentesIDOk",
                                                        ItemNC: "Reagentes estão identificados corretamente?",
                                                        Valor: DataCardValue122.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "DocumentosArmariosOk",
                                                        ItemNC: "Documentos nos armários estão identificados corretamente e acessíveis?",
                                                        Valor: DataCardValue123.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "PrateleirasId_Almox",
                                                        ItemNC: "Prateleiras estão organizadas, sem acúmulo de itens?",
                                                        Valor: DataCardValue124.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "ReagentesOk_Almox",
                                                        ItemNC: "Reagentes dentro da validade?",
                                                        Valor: DataCardValue125.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "VidrariasOk_Almox",
                                                        ItemNC: "Vidrarias limpas e organizadas em local apropriado?",
                                                        Valor: DataCardValue126.Selected.Value
                                                    }
                                                ),
                                                Valor = "Não Conforme"
                                            )
                                        );

                                        Set(
                                            varQtdNCAlmoxarifado,
                                            CountRows(colNcAlmoxarifado)
                                        );

                                        If(
                                            varTemNC_Almoxarifado,

                                            If(
                                                CountIf(
                                                    colNcAlmoxarifado As r,
                                                    IsBlank(
                                                        LookUp(
                                                            colMapaItens As mapa,
                                                            mapa.Campo = r.ItemChecklistOrigem,
                                                            mapa.Pilar
                                                        )
                                                    )
                                                ) > 0,

                                                Notify(
                                                    "❌ Existe item não conforme sem pilar correspondente em colMapaItens. Corrija o mapeamento antes de continuar.",
                                                    NotificationType.Error
                                                );
                                                Set(varPreparacaoAlmoxarifadoOk, false),

                                                ClearCollect(
                                                    colRodizioSalaAtual,
                                                    Filter(
                                                        RodizioPlanejado,
                                                        Sala.Value = varRegistroChecklist.Sala.Value &&
                                                        Publicado = true &&
                                                        StatusRodizio.Value = "Ativo" &&
                                                        InicioRodizio <= Today() &&
                                                        FimRodizio >= Today()
                                                    )
                                                );

                                                If(
                                                    CountRows(colRodizioSalaAtual) > 1,

                                                    Notify(
                                                        "❌ Existe mais de um rodízio ativo publicado para esta sala. Corrija a lista RodizioPlanejado antes de continuar.",
                                                        NotificationType.Error
                                                    );
                                                    Set(varRodizioValidado, false),

                                                    CountRows(colRodizioSalaAtual) = 0,

                                                    Set(varChecklistSemRodizioAtivo, true);
                                                    Set(varRodizioSala, Blank());
                                                    Set(
                                                        varResponsaveisNCAlmoxarifado,
                                                        Table(varPessoaLogadaSP)
                                                    );
                                                    Notify(
                                                        "⚠️ Nenhum rodízio ativo publicado foi encontrado. A NC será registrada provisoriamente para o usuário logado.",
                                                        NotificationType.Warning
                                                    ),

                                                    Set(varChecklistSemRodizioAtivo, false);
                                                    Set(
                                                        varRodizioSala,
                                                        First(colRodizioSalaAtual)
                                                    );

                                                    If(
                                                        CountRows(varRodizioSala.ResponsavelSala) = 0,

                                                        Set(
                                                            varResponsaveisNCAlmoxarifado,
                                                            Table(varPessoaLogadaSP)
                                                        );
                                                        Notify(
                                                            "⚠️ Rodízio ativo encontrado, mas sem responsável cadastrado. A NC será registrada provisoriamente para o usuário logado.",
                                                            NotificationType.Warning
                                                        ),

                                                        Set(
                                                            varResponsaveisNCAlmoxarifado,
                                                            varRodizioSala.ResponsavelSala
                                                        )
                                                    )
                                                );

                                                If(
                                                    varRodizioValidado,
                                                    ClearCollect(
                                                        colNCtemporarias,
                                                        ForAll(
                                                            colNcAlmoxarifado As r,
                                                            {
                                                                ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                                ItemNC: r.ItemNC,
                                                                Pilar: LookUp(
                                                                    colMapaItens As mapa,
                                                                    mapa.Campo = r.ItemChecklistOrigem,
                                                                    mapa.Pilar
                                                                ),
                                                                OrigemNC: "Checklist",
                                                                SalaNC: varRegistroChecklist.Sala.Value,
                                                                ChecklistID: varRegistroChecklist.ID,
                                                                Ciclo: Coalesce(
                                                                    varRegistroChecklist.Ciclo,
                                                                    varCicloAtual
                                                                ),
                                                                DataCriacao: Now(),
                                                                ResponsavelSala: If(
                                                                    IsEmpty(varResponsaveisNCAlmoxarifado),
                                                                    Table(varPessoaLogadaSP),
                                                                    varResponsaveisNCAlmoxarifado
                                                                ),
                                                                DescricaoNC: ""
                                                            }
                                                        )
                                                    )
                                                )
                                            )
                                        );

                                        If(
                                            !varPreparacaoAlmoxarifadoOk ||
                                            !varRodizioValidado,

                                            Set(varBusy, false),

                                            Set(
                                                varStatusGeralAlmoxarifado,
                                                If(
                                                    Coalesce(
                                                        varRegistroChecklist.StatusGeral.Value,
                                                        ""
                                                    ) = "Crítico",
                                                    "Crítico",
                                                    If(
                                                        Coalesce(
                                                            varRegistroChecklist.StatusGeral.Value,
                                                            ""
                                                        ) = "Atenção" ||
                                                        varTemNC_Almoxarifado,
                                                        "Atenção",
                                                        "Conforme"
                                                    )
                                                )
                                            );

                                            Set(
                                                varRegistroChecklistAtualizadoAlmoxarifado,
                                                IfError(
                                                    Patch(
                                                        Checklist_OrganizacaoPellet2025,
                                                        varRegistroChecklist,
                                                        {
                                                            MateriaisForaLugar: {
                                                                Value: DataCardValue120.Selected.Value
                                                            },
                                                            CaixasNaoID: {
                                                                Value: DataCardValue121.Selected.Value
                                                            },
                                                            ReagentesIDOk: {
                                                                Value: DataCardValue122.Selected.Value
                                                            },
                                                            DocumentosArmariosOk: {
                                                                Value: DataCardValue123.Selected.Value
                                                            },
                                                            PrateleirasId: {
                                                                Value: DataCardValue124.Selected.Value
                                                            },
                                                            ReagentesOk: {
                                                                Value: DataCardValue125.Selected.Value
                                                            },
                                                            VidrariasOk: {
                                                                Value: DataCardValue126.Selected.Value
                                                            },
                                                            StatusGeral: {
                                                                Value: varStatusGeralAlmoxarifado
                                                            },
                                                            StatusNC: If(
                                                                varTemNC_Almoxarifado ||
                                                                Coalesce(
                                                                    varRegistroChecklist.StatusNC.Value,
                                                                    ""
                                                                ) = "Pendente",
                                                                {
                                                                    Value: "Pendente"
                                                                },
                                                                {
                                                                    Value: "Concluído"
                                                                }
                                                            )
                                                        }
                                                    ),
                                                    Defaults(Checklist_OrganizacaoPellet2025)
                                                )
                                            );

                                            If(
                                                IsBlank(varRegistroChecklistAtualizadoAlmoxarifado.ID),

                                                Notify(
                                                    "❌ Erro ao salvar checklist do Almoxarifado. Verifique conexão ou permissão.",
                                                    NotificationType.Error
                                                );
                                                Set(varBusy, false),

                                                Set(
                                                    varRegistroChecklist,
                                                    varRegistroChecklistAtualizadoAlmoxarifado
                                                );

                                                If(
                                                    varTemNC_Almoxarifado,
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaNCAlmoxarifado,
                                                        ScreenTransition.Fade
                                                    ),
                                                    ResetForm(Form_Almoxarifado);
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaFinal,
                                                        ScreenTransition.Fade
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )

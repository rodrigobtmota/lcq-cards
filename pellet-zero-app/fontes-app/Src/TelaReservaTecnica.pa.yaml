                                                                            ""
                                                                        )
                                                                    )
                                                                ) &&
                                                                (
                                                                    (
                                                                        regraNC.ClassificacaoPadrao.Value = "Baixa" &&
                                                                        regraNC.PrazoDias = 15 &&
                                                                        Trim(
                                                                            Coalesce(
                                                                                regraNC.PrazoOperacional,
                                                                                ""
                                                                            )
                                                                        ) = "15 dias corridos"
                                                                    ) ||
                                                                    (
                                                                        regraNC.ClassificacaoPadrao.Value = "Média" &&
                                                                        regraNC.PrazoDias = 10 &&
                                                                        Trim(
                                                                            Coalesce(
                                                                                regraNC.PrazoOperacional,
                                                                                ""
                                                                            )
                                                                        ) = "10 dias corridos"
                                                                    ) ||
                                                                    (
                                                                        regraNC.ClassificacaoPadrao.Value = "Alta" &&
                                                                        regraNC.PrazoDias = 7 &&
                                                                        Trim(
                                                                            Coalesce(
                                                                                regraNC.PrazoOperacional,
                                                                                ""
                                                                            )
                                                                        ) = "7 dias corridos"
                                                                    ) ||
                                                                    (
                                                                        regraNC.ClassificacaoPadrao.Value = "Crítica / Segurança" &&
                                                                        regraNC.PrazoDias = 0 &&
                                                                        Trim(
                                                                            Coalesce(
                                                                                regraNC.PrazoOperacional,
                                                                                ""
                                                                            )
                                                                        ) = "Ação imediata"
                                                                    )
                                                                )
                                                        },
                                                        If(
                                                            !regraValida,
                                                            Collect(
                                                                colErrosMatrizNCReservaTecnica,
                                                                {
                                                                    ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                                    ItemNC: r.ItemNC,
                                                                    Motivo: If(
                                                                        !varMatrizClassificacaoNCValida,
                                                                        "Falha de carregamento da MatrizClassificacaoNC",
                                                                        qtdRegrasAtivas = 0,
                                                                        "Item sem correspondência ativa na MatrizClassificacaoNC",
                                                                        qtdRegrasAtivas > 1,
                                                                        "Mais de uma regra ativa encontrada para o item",
                                                                        "Regra ativa incompleta ou incompatível com a classificação oficial"
                                                                    )
                                                                }
                                                            )
                                                        )
                                                    )
                                                )
                                            );

                                            ClearCollect(
                                                colRodizioSalaAtual,
                                                Filter(
                                                    RodizioPlanejado,
                                                    Sala.Value = varRegistroChecklist.Sala.Value &&
                                                    Publicado = true &&
                                                    StatusRodizio.Value = "Ativo" &&
                                                    InicioRodizio <= Today() &&
                                                    FimRodizio >= Today()
                                                )
                                            );

                                            If(
                                                CountRows(colRodizioSalaAtual) > 1,

                                                Notify(
                                                    "❌ Existe mais de um rodízio ativo publicado para esta sala. Corrija a lista RodizioPlanejado antes de continuar.",
                                                    NotificationType.Error
                                                );
                                                Set(varRodizioValidado, false),

                                                CountRows(colRodizioSalaAtual) = 0,

                                                Set(varChecklistSemRodizioAtivo, true);
                                                Set(varRodizioSala, Blank());
                                                Set(
                                                    varResponsaveisNCReserva,
                                                    Table(varPessoaLogadaSP)
                                                );
                                                Notify(
                                                    "⚠️ Nenhum rodízio ativo publicado foi encontrado. A NC será registrada provisoriamente para o usuário logado.",
                                                    NotificationType.Warning
                                                ),

                                                Set(varChecklistSemRodizioAtivo, false);
                                                Set(
                                                    varRodizioSala,
                                                    First(colRodizioSalaAtual)
                                                );
                                                If(
                                                    CountRows(varRodizioSala.ResponsavelSala) = 0,
                                                    Set(
                                                        varResponsaveisNCReserva,
                                                        Table(varPessoaLogadaSP)
                                                    );
                                                    Notify(
                                                        "⚠️ Rodízio ativo encontrado, mas sem responsável cadastrado. A NC será registrada provisoriamente para o usuário logado.",
                                                        NotificationType.Warning
                                                    ),
                                                    Set(
                                                        varResponsaveisNCReserva,
                                                        varRodizioSala.ResponsavelSala
                                                    )
                                                )
                                            );

                                            If(
                                                varRodizioValidado,

                                                ClearCollect(
                                                    colNCtemporarias,
                                                    ForAll(
                                                        colNcReservaTecnica As r,
                                                        With(
                                                            {
                                                                qtdRegrasAtivas: CountRows(
                                                                    Filter(
                                                                        colMatrizClassificacaoNCAtiva As m,
                                                                        m.Campo = r.ItemChecklistOrigem
                                                                    )
                                                                ),
                                                                regraNC: LookUp(
                                                                    colMatrizClassificacaoNCAtiva As m,
                                                                    m.Campo = r.ItemChecklistOrigem
                                                                ),
                                                                pilarFallback: LookUp(
                                                                    colMapaItens As mapa,
                                                                    mapa.Campo = r.ItemChecklistOrigem,
                                                                    mapa.Pilar
                                                                )
                                                            },
                                                            With(
                                                                {
                                                                    regraValida:
                                                                        varMatrizClassificacaoNCValida &&
                                                                        qtdRegrasAtivas = 1 &&
                                                                        !IsBlank(regraNC.ID) &&
                                                                        !IsBlank(regraNC.Pilar.Value) &&
                                                                        !IsBlank(regraNC.ClassificacaoPadrao.Value) &&
                                                                        !IsBlank(regraNC.PrazoDias) &&
                                                                        !IsBlank(
                                                                            Trim(
                                                                                Coalesce(
                                                                                    regraNC.PrazoOperacional,
                                                                                    ""
                                                                                )
                                                                            )
                                                                        ) &&
                                                                        (
                                                                            (
                                                                                regraNC.ClassificacaoPadrao.Value = "Baixa" &&
                                                                                regraNC.PrazoDias = 15 &&
                                                                                Trim(
                                                                                    Coalesce(
                                                                                        regraNC.PrazoOperacional,
                                                                                        ""
                                                                                    )
                                                                                ) = "15 dias corridos"
                                                                            ) ||
                                                                            (
                                                                                regraNC.ClassificacaoPadrao.Value = "Média" &&
                                                                                regraNC.PrazoDias = 10 &&
                                                                                Trim(
                                                                                    Coalesce(
                                                                                        regraNC.PrazoOperacional,
                                                                                        ""
                                                                                    )
                                                                                ) = "10 dias corridos"
                                                                            ) ||
                                                                            (
                                                                                regraNC.ClassificacaoPadrao.Value = "Alta" &&
                                                                                regraNC.PrazoDias = 7 &&
                                                                                Trim(
                                                                                    Coalesce(
                                                                                        regraNC.PrazoOperacional,
                                                                                        ""
                                                                                    )
                                                                                ) = "7 dias corridos"
                                                                            ) ||
                                                                            (
                                                                                regraNC.ClassificacaoPadrao.Value = "Crítica / Segurança" &&
                                                                                regraNC.PrazoDias = 0 &&
                                                                                Trim(
                                                                                    Coalesce(
                                                                                        regraNC.PrazoOperacional,
                                                                                        ""
                                                                                    )
                                                                                ) = "Ação imediata"
                                                                            )
                                                                        )
                                                                },
                                                                {
                                                                    ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                                    ItemNC: r.ItemNC,
                                                                    Pilar: If(
                                                                        regraValida,
                                                                        regraNC.Pilar.Value,
                                                                        pilarFallback
                                                                    ),
                                                                    ClassificacaoNC: If(
                                                                        regraValida,
                                                                        regraNC.ClassificacaoPadrao.Value,
                                                                        "Média"
                                                                    ),
                                                                    PrazoDias: If(
                                                                        regraValida,
                                                                        regraNC.PrazoDias,
                                                                        10
                                                                    ),
                                                                    PrazoOperacional: If(
                                                                        regraValida,
                                                                        regraNC.PrazoOperacional,
                                                                        "10 dias corridos"
                                                                    ),
                                                                    ExigeEvidencia: If(
                                                                        regraValida,
                                                                        Coalesce(
                                                                            regraNC.ExigeEvidencia.Value,
                                                                            "Não"
                                                                        ),
                                                                        "Não"
                                                                    ),
                                                                    OrigemNC: "Checklist",
                                                                    SalaNC: varRegistroChecklist.Sala.Value,
                                                                    ChecklistID: varRegistroChecklist.ID,
                                                                    Ciclo: Coalesce(
                                                                        varRegistroChecklist.Ciclo,
                                                                        varCicloAtual
                                                                    ),
                                                                    DataCriacao: Now(),
                                                                    ResponsavelSala: If(
                                                                        IsEmpty(varResponsaveisNCReserva),
                                                                        Table(varPessoaLogadaSP),
                                                                        varResponsaveisNCReserva
                                                                    ),
                                                                    DescricaoNC: ""
                                                                }
                                                            )
                                                        )
                                                    )
                                                );

                                                If(
                                                    CountIf(
                                                        colNCtemporarias,
                                                        IsBlank(Pilar)
                                                    ) > 0,
                                                    Notify(
                                                        "❌ Existe item não conforme sem pilar correspondente em colMapaItens. Corrija o mapeamento antes de continuar.",
                                                        NotificationType.Error
                                                    );
                                                    Set(varMatrizReservaTecnicaValidada, false)
                                                );

                                                If(
                                                    !IsEmpty(colErrosMatrizNCReservaTecnica),
                                                    Notify(
                                                        "⚠️ Existem itens com falha na MatrizClassificacaoNC. Eles serão registrados em contingência com classificação Média e prazo de 10 dias: " &
                                                            Concat(
                                                                colErrosMatrizNCReservaTecnica,
                                                                ItemChecklistOrigem & " — " & Motivo,
                                                                " | "
                                                            ),
                                                        NotificationType.Warning
                                                    )
                                                );

                                                Set(
                                                    varReservaTecnicaPossuiNCCritica,
                                                    CountIf(
                                                        colNCtemporarias,
                                                        ClassificacaoNC = "Crítica / Segurança"
                                                    ) > 0
                                                )
                                            )
                                        );

                                        If(
                                            !varMatrizReservaTecnicaValidada ||
                                            !varRodizioValidado,

                                            Set(varBusy, false),

                                            Set(
                                                varStatusGeralReservaTecnica,
                                                If(
                                                    Coalesce(
                                                        varRegistroChecklist.StatusGeral.Value,
                                                        ""
                                                    ) = "Crítico" ||
                                                    varReservaTecnicaPossuiNCCritica,
                                                    "Crítico",
                                                    If(
                                                        Coalesce(
                                                            varRegistroChecklist.StatusGeral.Value,
                                                            ""
                                                        ) = "Atenção" ||
                                                        varTemNC_ReservaTecnica,
                                                        "Atenção",
                                                        "Conforme"
                                                    )
                                                )
                                            );

                                            Set(
                                                varSalvamentoChecklistReservaTecnicaOk,
                                                IfError(
                                                    Set(
                                                        varRegistroChecklist,
                                                        Patch(
                                                            Checklist_OrganizacaoPellet2025,
                                                            varRegistroChecklist,
                                                            {
                                                                PrateleirasLiberadas: {
                                                                    Value: DataCardValue128.Selected.Value
                                                                },
                                                                PrateleirasExcesso: {
                                                                    Value: DataCardValue129.Selected.Value
                                                                },
                                                                PotesPendentes: {
                                                                    Value: DataCardValue130.Selected.Value
                                                                },
                                                                PotesChao: {
                                                                    Value: DataCardValue131.Selected.Value
                                                                },
                                                                PisoOk: {
                                                                    Value: DataCardValue132.Selected.Value
                                                                },
                                                                PrateleirasOk: {
                                                                    Value: DataCardValue133.Selected.Value
                                                                },
                                                                EscadaOk: {
                                                                    Value: DataCardValue134.Selected.Value
                                                                },
                                                                EscadaFirme: {
                                                                    Value: DataCardValue135.Selected.Value
                                                                },
                                                                CorrimaoOk: {
                                                                    Value: DataCardValue136.Selected.Value
                                                                },
                                                                SegundoAndarOk: {
                                                                    Value: DataCardValue137.Selected.Value
                                                                },
                                                                PlataformaOk: {
                                                                    Value: DataCardValue138.Selected.Value
                                                                },
                                                                LuminariasOk: {
                                                                    Value: DataCardValue139.Selected.Value
                                                                },
                                                                PrateleirasIdentificas: {
                                                                    Value: DataCardValue140.Selected.Value
                                                                },
                                                                PrateleirasSobrecarga: {
                                                                    Value: DataCardValue141.Selected.Value
                                                                },
                                                                PrateleiraDanos: {
                                                                    Value: DataCardValue142.Selected.Value
                                                                },
                                                                PrateleirasNumerdas: {
                                                                    Value: DataCardValue145.Selected.Value
                                                                },
                                                                PotesLocaisNaoDefinidos: {
                                                                    Value: DataCardValue146.Selected.Value
                                                                },
                                                                StatusGeral: {
                                                                    Value: varStatusGeralReservaTecnica
                                                                },
                                                                StatusNC: If(
                                                                    varTemNC_ReservaTecnica ||
                                                                    Coalesce(
                                                                        varRegistroChecklist.StatusNC.Value,
                                                                        ""
                                                                    ) = "Pendente",
                                                                    {
                                                                        Value: "Pendente"
                                                                    },
                                                                    {
                                                                        Value: "Concluído"
                                                                    }
                                                                )
                                                            }
                                                        )
                                                    );
                                                    true,
                                                    Notify(
                                                        "❌ Erro ao salvar checklist da Reserva Técnica. Verifique conexão ou permissão.",
                                                        NotificationType.Error
                                                    );
                                                    false
                                                )
                                            );

                                            If(
                                                !varSalvamentoChecklistReservaTecnicaOk,
                                                Set(varBusy, false),
                                                If(
                                                    varTemNC_ReservaTecnica,
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaNCReservaTecnica,
                                                        ScreenTransition.Fade
                                                    ),
                                                    ResetForm(Form_Reserva);
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaFinal,
                                                        ScreenTransition.Fade
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =24
                              Text: ="ENVIAR CHECK LIST"
                              Width: =Parent.Width - 60
                              X: =32
                              Y: =16

                  - DataCard4:
                      Control: TypedDataCard@1.0.7
                      Variant: BlankCard
                      Properties:
                        BorderColor: =RGBA(244, 244, 244, 1)
                        DisplayMode: =Parent.DisplayMode
                        Fill: =RGBA(238,238,238,1)
                        Height: =150
                        Width: =1296
                        X: =0
                        Y: =7
                      Children:
                        - BtnEnviarTelaOficina:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =Color.White
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: |+
                                =// =======================================================
                                // TelaOficinaAOL - BtnEnviar.DisplayMode (CORRETO)
                                // =======================================================
                                If(
                                    varBusy,
                                    DisplayMode.Disabled,
                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),

                                            IsBlank(DataCardValue71.Selected.Value),
                                            IsBlank(DataCardValue72.Selected.Value),
                                            IsBlank(DataCardValue73.Selected.Value),
                                            IsBlank(DataCardValue74.Selected.Value),
                                            IsBlank(DataCardValue75.Selected.Value),
                                            IsBlank(DataCardValue76.Selected.Value),
                                            IsBlank(DataCardValue77.Selected.Value)
                                        ),
                                        DisplayMode.Disabled,
                                        DisplayMode.Edit
                                    )
                                )
                              Fill: '=RGBA(0, 56, 168, 1) '
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =95
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(0, 90, 160, 1)
                              OnSelect: |-
                                =If(
                                    varBusy,
                                    Blank(),

                                    Set(varBusy, true);
                                    Set(varRodizioValidado, true);
                                    Set(varChecklistSemRodizioAtivo, false);
                                    Set(varErroSalvarOficinaAOL, false);
                                    Set(varPodeAvancarOficinaAOL, true);
                                    Set(varOficinaAOLPossuiNCCritica, false);

                                    Clear(colRodizioSalaAtual);
                                    Clear(colNcOficinaAOL);
                                    Clear(colNCtemporarias);
                                    Clear(colNCtemporariasEnriquecidas);
                                    Clear(colErrosMatrizNCOficinaAOL);

                                    Set(
                                        varPessoaLogadaSP,
                                        {
                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims: "i:0#.f|membership|" & Lower(Coalesce(varUserEmail, User().Email)),
                                            DisplayName: Coalesce(varUserNome, User().FullName),
                                            Email: Lower(Coalesce(varUserEmail, User().Email)),
                                            Department: "",
                                            JobTitle: "",
                                            Picture: ""
                                        }
                                    );

                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),
                                            IsBlank(DataCardValue71.Selected.Value),
                                            IsBlank(DataCardValue72.Selected.Value),
                                            IsBlank(DataCardValue73.Selected.Value),
                                            IsBlank(DataCardValue74.Selected.Value),
                                            IsBlank(DataCardValue75.Selected.Value),
                                            IsBlank(DataCardValue76.Selected.Value),
                                            IsBlank(DataCardValue77.Selected.Value)
                                        ),

                                        Notify(
                                            "❌ Preencha todos os campos obrigatórios.",
                                            NotificationType.Error
                                        );
                                        Set(varBusy, false),

                                        Set(
                                            varTemNC_OficinaAOL,
                                            Or(
                                                DataCardValue71.Selected.Value = "Não Conforme",
                                                DataCardValue72.Selected.Value = "Não Conforme",
                                                DataCardValue73.Selected.Value = "Não Conforme",
                                                DataCardValue74.Selected.Value = "Não Conforme",
                                                DataCardValue75.Selected.Value = "Não Conforme",
                                                DataCardValue76.Selected.Value = "Não Conforme",
                                                DataCardValue77.Selected.Value = "Não Conforme"
                                            )
                                        );

                                        ClearCollect(
                                            colNcOficinaAOL,
                                            Filter(
                                                Table(
                                                    {
                                                        ItemChecklistOrigem: BancadaLimpaAOL_DataCard1.DataField,
                                                        ItemNC: "Bancadas estão limpas, organizadas e sem obstruções?",
                                                        Valor: DataCardValue71.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: FerramentasOkAOL_DataCard1.DataField,
                                                        ItemNC: "Ferramentas estão guardadas em local adequado e identificado?",
                                                        Valor: DataCardValue72.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: FiosOk_DataCard1.DataField,
                                                        ItemNC: "Cabos e fios estão organizados e não obstruem áreas de passagem?",
                                                        Valor: DataCardValue73.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: ChaoOk_DataCard1.DataField,
                                                        ItemNC: "Área de circulação está livre de materiais no chão?",
                                                        Valor: DataCardValue74.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: EtiquetasOkAOL_DataCard1.DataField,
                                                        ItemNC: "Prateleiras e armários estão identificados com etiquetas padronizadas?",
                                                        Valor: DataCardValue75.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: ArmariosIdentificadosAOL_DataCard1.DataField,
                                                        ItemNC: "Prateleiras e armários estão organizados conforme a finalidade?",
                                                        Valor: DataCardValue76.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: PontoColeta_DataCard1.DataField,
                                                        ItemNC: "Ponto de coleta de resíduos está limpo e sinalizado?",
                                                        Valor: DataCardValue77.Selected.Value
                                                    }
                                                ),
                                                Valor = "Não Conforme"
                                            )
                                        );

                                        Set(
                                            varQtdNCOficinaAOL,
                                            CountRows(colNcOficinaAOL)
                                        );

                                        If(
                                            varTemNC_OficinaAOL,

                                            ClearCollect(
                                                colRodizioSalaAtual,
                                                Filter(
                                                    RodizioPlanejado,
                                                    Sala.Value = varRegistroChecklist.Sala.Value &&
                                                    Publicado = true &&
                                                    StatusRodizio.Value = "Ativo" &&
                                                    InicioRodizio <= Today() &&
                                                    FimRodizio >= Today()
                                                )
                                            );

                                            If(
                                                CountRows(colRodizioSalaAtual) > 1,

                                                Notify(
                                                    "❌ Existe mais de um rodízio ativo publicado para esta sala. Corrija a lista RodizioPlanejado antes de continuar.",
                                                    NotificationType.Error
                                                );
                                                Set(varRodizioValidado, false);
                                                Set(varPodeAvancarOficinaAOL, false),

                                                CountRows(colRodizioSalaAtual) = 0,

                                                Set(varChecklistSemRodizioAtivo, true);
                                                Set(varRodizioSala, Blank());
                                                Set(
                                                    varResponsaveisNCOficina,
                                                    Table(varPessoaLogadaSP)
                                                );
                                                Notify(
                                                    "⚠️ Nenhum rodízio ativo publicado foi encontrado. A NC será registrada provisoriamente para o usuário logado.",
                                                    NotificationType.Warning
                                                ),

                                                Set(varChecklistSemRodizioAtivo, false);
                                                Set(
                                                    varRodizioSala,
                                                    First(colRodizioSalaAtual)
                                                );
                                                If(
                                                    CountRows(varRodizioSala.ResponsavelSala) = 0,
                                                    Set(
                                                        varResponsaveisNCOficina,
                                                        Table(varPessoaLogadaSP)
                                                    );
                                                    Notify(
                                                        "⚠️ Rodízio ativo encontrado, mas sem responsável cadastrado. A NC será registrada provisoriamente para o usuário logado.",
                                                        NotificationType.Warning
                                                    ),
                                                    Set(
                                                        varResponsaveisNCOficina,
                                                        varRodizioSala.ResponsavelSala
                                                    )
                                                )
                                            );

                                            If(
                                                varRodizioValidado,

                                                ForAll(
                                                    colNcOficinaAOL As r,
                                                    With(
                                                        {
                                                            qtdRegrasAtivas: CountRows(
                                                                Filter(
                                                                    colMatrizClassificacaoNCAtiva As m,
                                                                    m.Campo = r.ItemChecklistOrigem
                                                                )
                                                            ),
                                                            regraNC: LookUp(
                                                                colMatrizClassificacaoNCAtiva As m,
                                                                m.Campo = r.ItemChecklistOrigem
                                                            )
                                                        },
                                                        With(
                                                            {
                                                                regraValida:
                                                                    varMatrizClassificacaoNCValida &&
                                                                    qtdRegrasAtivas = 1 &&
                                                                    !IsBlank(regraNC.ID) &&
                                                                    !IsBlank(regraNC.Pilar.Value) &&
                                                                    !IsBlank(regraNC.ClassificacaoPadrao.Value) &&
                                                                    !IsBlank(regraNC.PrazoDias) &&
                                                                    !IsBlank(
                                                                        Trim(
                                                                            Coalesce(
                                                                                regraNC.PrazoOperacional,
                                                                                ""
                                                                            )
                                                                        )
                                                                    ) &&
                                                                    (
                                                                        (
                                                                            regraNC.ClassificacaoPadrao.Value = "Baixa" &&
                                                                            regraNC.PrazoDias = 15 &&
                                                                            Trim(
                                                                                Coalesce(
                                                                                    regraNC.PrazoOperacional,
                                                                                    ""
                                                                                )
                                                                            ) = "15 dias corridos"
                                                                        ) ||
                                                                        (
                                                                            regraNC.ClassificacaoPadrao.Value = "Média" &&
                                                                            regraNC.PrazoDias = 10 &&
                                                                            Trim(
                                                                                Coalesce(
                                                                                    regraNC.PrazoOperacional,
                                                                                    ""
                                                                                )
                                                                            ) = "10 dias corridos"
                                                                        ) ||
                                                                        (
                                                                            regraNC.ClassificacaoPadrao.Value = "Alta" &&
                                                                            regraNC.PrazoDias = 7 &&
                                                                            Trim(
                                                                                Coalesce(
                                                                                    regraNC.PrazoOperacional,
                                                                                    ""
                                                                                )
                                                                            ) = "7 dias corridos"
                                                                        ) ||
                                                                        (
                                                                            regraNC.ClassificacaoPadrao.Value = "Crítica / Segurança" &&
                                                                            regraNC.PrazoDias = 0 &&
                                                                            Trim(
                                                                                Coalesce(
                                                                                    regraNC.PrazoOperacional,
                                                                                    ""
                                                                                )
                                                                            ) = "Ação imediata"
                                                                        )
                                                                    )
                                                            },
                                                            If(
                                                                !regraValida,
                                                                Collect(
                                                                    colErrosMatrizNCOficinaAOL,
                                                                    {
                                                                        ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                                        ItemNC: r.ItemNC,
                                                                        Motivo: If(
                                                                            !varMatrizClassificacaoNCValida,
                                                                            "Falha de carregamento da MatrizClassificacaoNC",
                                                                            qtdRegrasAtivas = 0,
                                                                            "Item sem correspondência ativa na MatrizClassificacaoNC",
                                                                            qtdRegrasAtivas > 1,
                                                                            "Mais de uma regra ativa encontrada para o item",
                                                                            "Regra ativa incompleta ou incompatível com a classificação oficial"
                                                                        )
                                                                    }
                                                                )
                                                            )
                                                        )
                                                    )
                                                );

                                                ClearCollect(
                                                    colNCtemporariasEnriquecidas,
                                                    ForAll(
                                                        colNcOficinaAOL As r,
                                                        With(
                                                            {
                                                                qtdRegrasAtivas: CountRows(
                                                                    Filter(
                                                                        colMatrizClassificacaoNCAtiva As m,
                                                                        m.Campo = r.ItemChecklistOrigem
                                                                    )
                                                                ),
                                                                regraNC: LookUp(
                                                                    colMatrizClassificacaoNCAtiva As m,
                                                                    m.Campo = r.ItemChecklistOrigem
                                                                ),
                                                                pilarFallback: LookUp(
                                                                    colMapaItens As mapa,
                                                                    mapa.Campo = r.ItemChecklistOrigem,
                                                                    mapa.Pilar
                                                                )
                                                            },
                                                            With(
                                                                {
                                                                    regraValida:
                                                                        varMatrizClassificacaoNCValida &&
                                                                        qtdRegrasAtivas = 1 &&
                                                                        !IsBlank(regraNC.ID) &&
                                                                        !IsBlank(regraNC.Pilar.Value) &&
                                                                        !IsBlank(regraNC.ClassificacaoPadrao.Value) &&
                                                                        !IsBlank(regraNC.PrazoDias) &&
                                                                        !IsBlank(
                                                                            Trim(
                                                                                Coalesce(
                                                                                    regraNC.PrazoOperacional,
                                                                                    ""
                                                                                )
                                                                            )
                                                                        ) &&
                                                                        (
                                                                            (
                                                                                regraNC.ClassificacaoPadrao.Value = "Baixa" &&
                                                                                regraNC.PrazoDias = 15 &&
                                                                                Trim(
                                                                                    Coalesce(
                                                                                        regraNC.PrazoOperacional,
                                                                                        ""
                                                                                    )
                                                                                ) = "15 dias corridos"
                                                                            ) ||
                                                                            (
                                                                                regraNC.ClassificacaoPadrao.Value = "Média" &&
                                                                                regraNC.PrazoDias = 10 &&
                                                                                Trim(
                                                                                    Coalesce(
                                                                                        regraNC.PrazoOperacional,
                                                                                        ""
                                                                                    )
                                                                                ) = "10 dias corridos"
                                                                            ) ||
                                                                            (
                                                                                regraNC.ClassificacaoPadrao.Value = "Alta" &&
                                                                                regraNC.PrazoDias = 7 &&
                                                                                Trim(
                                                                                    Coalesce(
                                                                                        regraNC.PrazoOperacional,
                                                                                        ""
                                                                                    )
                                                                                ) = "7 dias corridos"
                                                                            ) ||
                                                                            (
                                                                                regraNC.ClassificacaoPadrao.Value = "Crítica / Segurança" &&
                                                                                regraNC.PrazoDias = 0 &&
                                                                                Trim(
                                                                                    Coalesce(
                                                                                        regraNC.PrazoOperacional,
                                                                                        ""
                                                                                    )
                                                                                ) = "Ação imediata"
                                                                            )
                                                                        )
                                                                },
                                                                {
                                                                    ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                                    ItemNC: r.ItemNC,
                                                                    Pilar: If(
                                                                        regraValida,
                                                                        regraNC.Pilar.Value,
                                                                        pilarFallback
                                                                    ),
                                                                    ClassificacaoNC: If(
                                                                        regraValida,
                                                                        regraNC.ClassificacaoPadrao.Value,
                                                                        "Média"
                                                                    ),
                                                                    PrazoDias: If(
                                                                        regraValida,
                                                                        regraNC.PrazoDias,
                                                                        10
                                                                    ),
                                                                    PrazoOperacional: If(
                                                                        regraValida,
                                                                        regraNC.PrazoOperacional,
                                                                        "10 dias corridos"
                                                                    ),
                                                                    ExigeEvidencia: If(
                                                                        regraValida,
                                                                        Coalesce(
                                                                            regraNC.ExigeEvidencia.Value,
                                                                            "Não"
                                                                        ),
                                                                        "Não"
                                                                    ),
                                                                    OrigemNC: "Checklist",
                                                                    SalaNC: varRegistroChecklist.Sala.Value,
                                                                    ChecklistID: varRegistroChecklist.ID,
                                                                    Ciclo: Coalesce(
                                                                        varRegistroChecklist.Ciclo,
                                                                        varCicloAtual
                                                                    ),
                                                                    DataCriacao: Now(),
                                                                    ResponsavelSala: If(
                                                                        IsEmpty(varResponsaveisNCOficina),
                                                                        Table(varPessoaLogadaSP),
                                                                        varResponsaveisNCOficina
                                                                    ),
                                                                    DescricaoNC: ""
                                                                }
                                                            )
                                                        )
                                                    )
                                                );

                                                ClearCollect(
                                                    colNCtemporarias,
                                                    colNCtemporariasEnriquecidas
                                                );
                                                Clear(colNCtemporariasEnriquecidas);

                                                If(
                                                    CountIf(
                                                        colNCtemporarias,
                                                        IsBlank(Pilar)
                                                    ) > 0,
                                                    Notify(
                                                        "❌ Existe item não conforme sem pilar correspondente em colMapaItens. Corrija o mapeamento antes de continuar.",
                                                        NotificationType.Error
                                                    );
                                                    Set(varPodeAvancarOficinaAOL, false)
                                                );

                                                If(
                                                    !IsEmpty(colErrosMatrizNCOficinaAOL),
                                                    Notify(
                                                        "⚠️ Existem itens com falha na MatrizClassificacaoNC. Eles serão registrados em contingência com classificação Média e prazo de 10 dias: " &
                                                            Concat(
                                                                colErrosMatrizNCOficinaAOL,
                                                                ItemChecklistOrigem & " — " & Motivo,
                                                                " | "
                                                            ),
                                                        NotificationType.Warning
                                                    )
                                                );

                                                Set(
                                                    varOficinaAOLPossuiNCCritica,
                                                    CountIf(
                                                        colNCtemporarias,
                                                        ClassificacaoNC = "Crítica / Segurança"
                                                    ) > 0
                                                )
                                            )
                                        );

                                        If(
                                            !varPodeAvancarOficinaAOL,

                                            Set(varBusy, false),

                                            Set(
                                                varStatusGeralOficinaAOL,
                                                If(
                                                    Coalesce(
                                                        varRegistroChecklist.StatusGeral.Value,
                                                        ""
                                                    ) = "Crítico" ||
                                                    varOficinaAOLPossuiNCCritica,
                                                    "Crítico",
                                                    If(
                                                        Coalesce(
                                                            varRegistroChecklist.StatusGeral.Value,
                                                            ""
                                                        ) = "Atenção" ||
                                                        varTemNC_OficinaAOL,
                                                        "Atenção",
                                                        "Conforme"
                                                    )
                                                )
                                            );

                                            IfError(
                                                Set(
                                                    varRegistroChecklist,
                                                    Patch(
                                                        Checklist_OrganizacaoPellet2025,
                                                        varRegistroChecklist,
                                                        {
                                                            BancadaLimpaAOL: {
                                                                Value: DataCardValue71.Selected.Value
                                                            },
                                                            FerramentasOkAOL: {
                                                                Value: DataCardValue72.Selected.Value
                                                            },
                                                            FiosOk: {
                                                                Value: DataCardValue73.Selected.Value
                                                            },
                                                            ChaoOk: {
                                                                Value: DataCardValue74.Selected.Value
                                                            },
                                                            EtiquetasOkAOL: {
                                                                Value: DataCardValue75.Selected.Value
                                                            },
                                                            ArmariosIdentificadosAOL: {
                                                                Value: DataCardValue76.Selected.Value
                                                            },
                                                            PontoColeta: {
                                                                Value: DataCardValue77.Selected.Value
                                                            },
                                                            StatusGeral: {
                                                                Value: varStatusGeralOficinaAOL
                                                            },
                                                            StatusNC: If(
                                                                varTemNC_OficinaAOL ||
                                                                Coalesce(
                                                                    varRegistroChecklist.StatusNC.Value,
                                                                    ""
                                                                ) = "Pendente",
                                                                {
                                                                    Value: "Pendente"
                                                                },
                                                                {
                                                                    Value: "Concluído"
                                                                }
                                                            )
                                                        }
                                                    )
                                                ),
                                                Set(varErroSalvarOficinaAOL, true);
                                                Notify(
                                                    "❌ Erro ao salvar checklist da Oficina AOL. Verifique conexão ou permissão.",
                                                    NotificationType.Error
                                                );
                                                Set(varBusy, false)
                                            );

                                            If(
                                                !varErroSalvarOficinaAOL,
                                                If(
                                                    varTemNC_OficinaAOL,
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaNCOficinaAOL,
                                                        ScreenTransition.Fade
                                                    ),
                                                    ResetForm(Form_Oficina);
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaFinal,
                                                        ScreenTransition.Fade
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =24
                              Text: ="ENVIAR CHECK LIST"
                              Width: =Parent.Width - 60
                              X: =30

                  - DataCard1:
                      Control: TypedDataCard@1.0.7
                      Variant: BlankCard
                      Properties:
                        BorderColor: =Color.Transparent
                        Fill: =RGBA(238, 238, 238, 1)
                        Height: =144
                        Width: =1296
                        X: =0
                        Y: =10
                      Children:
                        - Btn_Enviar_TelaOrg:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =Color.White
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: |-
                                =If(
                                    varBusy,
                                    DisplayMode.Disabled,
                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),
                                            IsBlank(DataCardValue11.Selected.Value),
                                            IsBlank(DataCardValue18.Selected.Value),
                                            IsBlank(DataCardValue9.Selected.Value),
                                            IsBlank(DataCardValue12.Selected.Value),
                                            IsBlank(DataCardValue14.Selected.Value),
                                            IsBlank(DataCardValue17.Selected.Value),
                                            IsBlank(DataCardValue16.Selected.Value),
                                            IsBlank(DataCardValue15.Selected.Value),
                                            IsBlank(DataCardValue13.Selected.Value)
                                        ),
                                        DisplayMode.Disabled,
                                        DisplayMode.Edit
                                    )
                                )
                              Fill: '=RGBA(0, 56, 168, 1) '
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =112
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(0, 90, 160, 1)
                              OnSelect: |+
                                =If(
                                    varBusy,
                                    Blank(),

                                    Set(varBusy, true);
                                    Set(varRodizioValidado, true);
                                    Set(varPreparacaoOrganizacaoOk, true);
                                    Set(varErroSalvarOrganizacao, false);

                                    Clear(colRodizioSalaAtual);
                                    Clear(colNcOrganizacao);
                                    Clear(colNCtemporarias);

                                    Set(
                                        varPessoaLogadaSP,
                                        {
                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims: "i:0#.f|membership|" & Lower(Coalesce(varUserEmail, User().Email)),
                                            DisplayName: Coalesce(varUserNome, User().FullName),
                                            Email: Lower(Coalesce(varUserEmail, User().Email)),
                                            Department: "",
                                            JobTitle: "",
                                            Picture: ""
                                        }
                                    );

                                    Set(
                                        varSalaVaiParaPellet,
                                        Or(
                                            varRegistroChecklist.Sala.Value = "Sala de Físico-Químico 3",
                                            varRegistroChecklist.Sala.Value = "Sala de Físico-Químico 4",
                                            varRegistroChecklist.Sala.Value = "Sala de Processamento de Resinas",
                                            varRegistroChecklist.Sala.Value = "Sala de Reserva Técnica"
                                        )
                                    );

                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),
                                            IsBlank(DataCardValue11.Selected.Value),
                                            IsBlank(DataCardValue18.Selected.Value),
                                            IsBlank(DataCardValue9.Selected.Value),
                                            IsBlank(DataCardValue12.Selected.Value),
                                            IsBlank(DataCardValue14.Selected.Value),
                                            IsBlank(DataCardValue17.Selected.Value),
                                            IsBlank(DataCardValue16.Selected.Value),
                                            IsBlank(DataCardValue15.Selected.Value),
                                            IsBlank(DataCardValue13.Selected.Value)
                                        ),

                                        Notify(
                                            "❌ Preencha todos os campos obrigatórios.",
                                            NotificationType.Error
                                        );
                                        Set(varBusy, false),

                                        Set(
                                            varTemNC_Organizacao,
                                            Or(
                                                DataCardValue11.Selected.Value = "Não Conforme",
                                                DataCardValue18.Selected.Value = "Não Conforme",
                                                DataCardValue9.Selected.Value = "Não Conforme",
                                                DataCardValue12.Selected.Value = "Não Conforme",
                                                DataCardValue14.Selected.Value = "Não Conforme",
                                                DataCardValue17.Selected.Value = "Não Conforme",
                                                DataCardValue16.Selected.Value = "Não Conforme",
                                                DataCardValue15.Selected.Value = "Não Conforme",
                                                DataCardValue13.Selected.Value = "Não Conforme"
                                            )
                                        );

                                        ClearCollect(
                                            colNcOrganizacao,
                                            Filter(
                                                Table(
                                                    {
                                                        ItemChecklistOrigem: DescartesSinalizados_DataCard1.DataField,
                                                        ItemNC: "Pontos de descarte estão corretamente identificados?",
                                                        Valor: DataCardValue11.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: VidrariasOk_DataCard1.DataField,
                                                        ItemNC: "Vidrarias limpas e organizadas em local apropriado?",
                                                        Valor: DataCardValue18.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: IdentificacaoFrascos_DataCard2.DataField,
                                                        ItemNC: "Frascos e cilindros possuem identificação conforme o padrão?",
                                                        Valor: DataCardValue9.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: EtiquetasOk_DataCard1.DataField,
                                                        ItemNC: "Etiquetas estão padronizadas e visíveis?",
                                                        Valor: DataCardValue12.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: PrateleirasId_DataCard2.DataField,
                                                        ItemNC: "Prateleiras e armários estão identificados corretamente?",
                                                        Valor: DataCardValue14.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: SinalizacaoAtual_DataCard1.DataField,
                                                        ItemNC: "Sinalização das rotas de fuga no corredor e sala estão visíveis e claras?",
                                                        Valor: DataCardValue17.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: RotasFuga_DataCard1.DataField,
                                                        ItemNC: "Rotas de fuga no corredor e sala estão livres e desobstruídas?",
                                                        Valor: DataCardValue16.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: ReagentesOk_DataCard1.DataField,
                                                        ItemNC: "Todos os reagentes estão dentro do prazo de validade?",
                                                        Valor: DataCardValue15.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: FerramentasOk_DataCard1.DataField,
                                                        ItemNC: "Ferramentas estão identificadas conforme o padrão visual do ciclo vigente?",
                                                        Valor: DataCardValue13.Selected.Value
                                                    }
                                                ),
                                                Valor = "Não Conforme"
                                            )
                                        );

                                        Set(varQtdNCOrganizacao, CountRows(colNcOrganizacao));

                                        If(
                                            varTemNC_Organizacao,

                                            If(
                                                CountIf(
                                                    colNcOrganizacao As r,
                                                    IsBlank(
                                                        LookUp(
                                                            colMapaItens As mapa,
                                                            mapa.Campo = r.ItemChecklistOrigem,
                                                            mapa.Pilar
                                                        )
                                                    )
                                                ) > 0,

                                                Notify(
                                                    "❌ Existe item não conforme sem pilar correspondente em colMapaItens. Corrija o mapeamento antes de continuar.",
                                                    NotificationType.Error
                                                );
                                                Set(varPreparacaoOrganizacaoOk, false),

                                                ClearCollect(
                                                    colRodizioSalaAtual,
                                                    Filter(
                                                        RodizioPlanejado,
                                                        Sala.Value = varRegistroChecklist.Sala.Value &&
                                                        Publicado = true &&
                                                        StatusRodizio.Value = "Ativo" &&
                                                        InicioRodizio <= Today() &&
                                                        FimRodizio >= Today()
                                                    )
                                                );

                                                If(
                                                    CountRows(colRodizioSalaAtual) > 1,

                                                    Notify(
                                                        "❌ Existe mais de um rodízio ativo publicado para esta sala. Corrija a lista RodizioPlanejado antes de continuar.",
                                                        NotificationType.Error
                                                    );
                                                    Set(varRodizioValidado, false),

                                                    CountRows(colRodizioSalaAtual) = 1 &&
                                                    CountRows(First(colRodizioSalaAtual).ResponsavelSala) > 0,

                                                    Set(varRodizioSala, First(colRodizioSalaAtual));
                                                    Set(varResponsavelSalaNC, varRodizioSala.ResponsavelSala),

                                                    Notify(
                                                        "⚠️ Não foi localizado rodízio ativo com responsável para esta sala. A NC será registrada provisoriamente para o usuário logado.",
                                                        NotificationType.Warning
                                                    );
                                                    Set(varRodizioSala, Blank());
                                                    Set(varResponsavelSalaNC, Table(varPessoaLogadaSP))
                                                );

                                                If(
                                                    varRodizioValidado,
                                                    ClearCollect(
                                                        colNCtemporarias,
                                                        ForAll(
                                                            colNcOrganizacao As r,
                                                            {
                                                                ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                                ItemNC: r.ItemNC,
                                                                Pilar: LookUp(
                                                                    colMapaItens As mapa,
                                                                    mapa.Campo = r.ItemChecklistOrigem,
                                                                    mapa.Pilar
                                                                ),
                                                                OrigemNC: "Checklist",
                                                                SalaNC: varRegistroChecklist.Sala.Value,
                                                                ChecklistID: varRegistroChecklist.ID,
                                                                Ciclo: Coalesce(
                                                                    varRegistroChecklist.Ciclo,
                                                                    varCicloAtual
                                                                ),
                                                                DataCriacao: Now(),
                                                                ResponsavelSala: varResponsavelSalaNC,
                                                                DescricaoNC: ""
                                                            }
                                                        )
                                                    )
                                                )
                                            )
                                        );

                                        If(
                                            !varPreparacaoOrganizacaoOk || !varRodizioValidado,

                                            Set(varBusy, false),

                                            Set(
                                                varStatusGeralOrganizacao,
                                                If(
                                                    Coalesce(varRegistroChecklist.StatusGeral.Value, "") = "Crítico",
                                                    "Crítico",
                                                    If(
                                                        Coalesce(varRegistroChecklist.StatusGeral.Value, "") = "Atenção" ||
                                                        varTemNC_Organizacao,
                                                        "Atenção",
                                                        "Conforme"
                                                    )
                                                )
                                            );

                                            IfError(
                                                Set(
                                                    varRegistroChecklist,
                                                    Patch(
                                                        Checklist_OrganizacaoPellet2025,
                                                        varRegistroChecklist,
                                                        {
                                                            DescartesSinalizados: {Value: DataCardValue11.Selected.Value},
                                                            VidrariasOk: {Value: DataCardValue18.Selected.Value},
                                                            IdentificacaoFrascos: {Value: DataCardValue9.Selected.Value},
                                                            EtiquetasOk: {Value: DataCardValue12.Selected.Value},
                                                            PrateleirasId: {Value: DataCardValue14.Selected.Value},
                                                            SinalizacaoAtual: {Value: DataCardValue17.Selected.Value},
                                                            RotasFuga: {Value: DataCardValue16.Selected.Value},
                                                            ReagentesOk: {Value: DataCardValue15.Selected.Value},
                                                            FerramentasOk: {Value: DataCardValue13.Selected.Value},
                                                            StatusGeral: {Value: varStatusGeralOrganizacao},
                                                            StatusNC: If(
                                                                varTemNC_Organizacao ||
                                                                varSalaVaiParaPellet ||
                                                                Coalesce(varRegistroChecklist.StatusNC.Value, "") = "Pendente",
                                                                {Value: "Pendente"},
                                                                {Value: "Concluído"}
                                                            )
                                                        }
                                                    )
                                                ),

                                                Set(varErroSalvarOrganizacao, true);
                                                Notify(
                                                    "❌ Erro ao salvar checklist de Organização. Verifique conexão ou permissão.",
                                                    NotificationType.Error
                                                );
                                                Set(varBusy, false)
                                            );

                                            If(
                                                !varErroSalvarOrganizacao,

                                                If(
                                                    varTemNC_Organizacao,

                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaNCOrganizacao,
                                                        ScreenTransition.Fade
                                                    ),

                                                    ResetForm(Form_telaOrganizacao);
                                                    Set(varBusy, false);

                                                    If(
                                                        varSalaVaiParaPellet,
                                                        Navigate(
                                                            TelaPellet,
                                                            ScreenTransition.Fade
                                                        ),
                                                        Navigate(
                                                            TelaFinal,
                                                            ScreenTransition.Fade
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =24
                              Text: ="ENVIAR CHECK LIST"
                              Width: =1200
                              X: =30
                              Y: =24

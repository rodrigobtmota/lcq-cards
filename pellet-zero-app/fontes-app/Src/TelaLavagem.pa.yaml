                              OnSelect: |-
                                =If(
                                    varBusy,
                                    Blank(),

                                    Set(varBusy, true);
                                    Set(varRodizioValidado, true);
                                    Set(
                                        varRegistroChecklistAtualizadoLavagem,
                                        Defaults(Checklist_OrganizacaoPellet2025)
                                    );

                                    Clear(colRodizioSalaAtual);
                                    Clear(colNcLavagem);
                                    Clear(colNCtemporarias);

                                    Set(
                                        varPessoaLogadaSP,
                                        {
                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims: "i:0#.f|membership|" & Lower(Coalesce(varUserEmail, User().Email)),
                                            DisplayName: Coalesce(varUserNome, User().FullName),
                                            Email: Lower(Coalesce(varUserEmail, User().Email)),
                                            Department: "",
                                            JobTitle: "",
                                            Picture: ""
                                        }
                                    );

                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),
                                            IsBlank(DataCardValue31.Selected.Value),
                                            IsBlank(DataCardValue97.Selected.Value),
                                            IsBlank(DataCardValue87.Selected.Value),
                                            IsBlank(DataCardValue50.Selected.Value),
                                            IsBlank(DataCardValue89.Selected.Value),
                                            IsBlank(DataCardValue88.Selected.Value),
                                            IsBlank(DataCardValue101.Selected.Value),
                                            IsBlank(DataCardValue98.Selected.Value),
                                            IsBlank(DataCardValue99.Selected.Value)
                                        ),

                                        Notify(
                                            "❌ Preencha todos os campos obrigatórios.",
                                            NotificationType.Error
                                        );
                                        Set(varBusy, false),

                                        Set(
                                            varTemNC_Lavagem,
                                            Or(
                                                DataCardValue31.Selected.Value = "Não Conforme",
                                                DataCardValue97.Selected.Value = "Não Conforme",
                                                DataCardValue87.Selected.Value = "Não Conforme",
                                                DataCardValue50.Selected.Value = "Não Conforme",
                                                DataCardValue89.Selected.Value = "Não Conforme",
                                                DataCardValue88.Selected.Value = "Não Conforme",
                                                DataCardValue101.Selected.Value = "Não Conforme",
                                                DataCardValue98.Selected.Value = "Não Conforme",
                                                DataCardValue99.Selected.Value = "Não Conforme"
                                            )
                                        );

                                        ClearCollect(
                                            colNcLavagem,
                                            Filter(
                                                Table(
                                                    {
                                                        ItemChecklistOrigem: "SalaLimpaOrganizada",
                                                        ItemNC: "Área está limpa, sem acúmulo de sujeira ou resíduos?",
                                                        Valor: DataCardValue31.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "BancadasLimpas_Lav",
                                                        ItemNC: "Bancadas estão livres e desobstruídas?",
                                                        Valor: DataCardValue97.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "DescartesSinalizados_Lav",
                                                        ItemNC: "Recipientes de descarte estão identificados corretamente?",
                                                        Valor: DataCardValue87.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "ResiduosForaLugar",
                                                        ItemNC: "Resíduos estão armazenados de forma segura e adequada?",
                                                        Valor: DataCardValue50.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "ReagentesIDOk_Lav",
                                                        ItemNC: "Amostras estão identificadas corretamente?",
                                                        Valor: DataCardValue89.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "ReagentesOk_Lav",
                                                        ItemNC: "Há amostras vencidas ou sem uso armazenadas?",
                                                        Valor: DataCardValue88.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "GeladeiraOk",
                                                        ItemNC: "Geladeira está limpa, organizada e em bom funcionamento?",
                                                        Valor: DataCardValue101.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "GeradorGeloOk",
                                                        ItemNC: "Gerador de gelo está em funcionamento?",
                                                        Valor: DataCardValue98.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "CapelaStatus",
                                                        ItemNC: "Capela está com manutenção atualizada e funcionamento adequado?",
                                                        Valor: DataCardValue99.Selected.Value
                                                    }
                                                ),
                                                Valor = "Não Conforme"
                                            )
                                        );

                                        Set(
                                            varQtdNCLavagem,
                                            CountRows(colNcLavagem)
                                        );

                                        If(
                                            varTemNC_Lavagem,

                                            ClearCollect(
                                                colRodizioSalaAtual,
                                                Filter(
                                                    RodizioPlanejado,
                                                    Sala.Value = varRegistroChecklist.Sala.Value &&
                                                    Publicado = true &&
                                                    StatusRodizio.Value = "Ativo" &&
                                                    InicioRodizio <= Today() &&
                                                    FimRodizio >= Today()
                                                )
                                            );

                                            If(
                                                CountRows(colRodizioSalaAtual) > 1,

                                                Notify(
                                                    "❌ Existe mais de um rodízio ativo publicado para esta sala. Corrija a lista RodizioPlanejado antes de continuar.",
                                                    NotificationType.Error
                                                );
                                                Set(varRodizioValidado, false),

                                                CountRows(colRodizioSalaAtual) = 0,

                                                Set(varRodizioSala, Blank());
                                                Set(varResponsaveisNCLavagem, Table(varPessoaLogadaSP));
                                                Notify(
                                                    "⚠️ Nenhum rodízio ativo publicado foi encontrado. A NC será registrada provisoriamente para o usuário logado.",
                                                    NotificationType.Warning
                                                ),

                                                Set(varRodizioSala, First(colRodizioSalaAtual));
                                                If(
                                                    CountRows(varRodizioSala.ResponsavelSala) = 0,
                                                    Set(varResponsaveisNCLavagem, Table(varPessoaLogadaSP));
                                                    Notify(
                                                        "⚠️ Rodízio ativo encontrado, mas sem responsável cadastrado. A NC será registrada provisoriamente para o usuário logado.",
                                                        NotificationType.Warning
                                                    ),
                                                    Set(varResponsaveisNCLavagem, varRodizioSala.ResponsavelSala)
                                                )
                                            );

                                            If(
                                                varRodizioValidado,
                                                ClearCollect(
                                                    colNCtemporarias,
                                                    ForAll(
                                                        colNcLavagem As r,
                                                        {
                                                            ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                            ItemNC: r.ItemNC,
                                                            Pilar: LookUp(
                                                                colMapaItens As mapa,
                                                                mapa.Campo = r.ItemChecklistOrigem,
                                                                mapa.Pilar
                                                            ),
                                                            OrigemNC: "Checklist",
                                                            SalaNC: varRegistroChecklist.Sala.Value,
                                                            ChecklistID: varRegistroChecklist.ID,
                                                            Ciclo: Coalesce(varRegistroChecklist.Ciclo, varCicloAtual),
                                                            DataCriacao: Now(),
                                                            ResponsavelSala: If(
                                                                IsEmpty(varResponsaveisNCLavagem),
                                                                Table(varPessoaLogadaSP),
                                                                varResponsaveisNCLavagem
                                                            ),
                                                            DescricaoNC: ""
                                                        }
                                                    )
                                                )
                                            )
                                        );

                                        If(
                                            !varRodizioValidado,
                                            Set(varBusy, false),

                                            Set(
                                                varStatusGeralLavagem,
                                                If(
                                                    Coalesce(varRegistroChecklist.StatusGeral.Value, "") = "Crítico",
                                                    "Crítico",
                                                    If(
                                                        Coalesce(varRegistroChecklist.StatusGeral.Value, "") = "Atenção" ||
                                                        varTemNC_Lavagem,
                                                        "Atenção",
                                                        "Conforme"
                                                    )
                                                )
                                            );

                                            Set(
                                                varRegistroChecklistAtualizadoLavagem,
                                                IfError(
                                                    Patch(
                                                        Checklist_OrganizacaoPellet2025,
                                                        varRegistroChecklist,
                                                        {
                                                            SalaLimpaOrganizada: {
                                                                Value: DataCardValue31.Selected.Value
                                                            },
                                                            BancadasLimpas: {
                                                                Value: DataCardValue97.Selected.Value
                                                            },
                                                            DescartesSinalizados: {
                                                                Value: DataCardValue87.Selected.Value
                                                            },
                                                            ResiduosForaLugar: {
                                                                Value: DataCardValue50.Selected.Value
                                                            },
                                                            ReagentesIDOk: {
                                                                Value: DataCardValue89.Selected.Value
                                                            },
                                                            ReagentesOk: {
                                                                Value: DataCardValue88.Selected.Value
                                                            },
                                                            GeladeiraOk: {
                                                                Value: DataCardValue101.Selected.Value
                                                            },
                                                            GeradorGeloOk: {
                                                                Value: DataCardValue98.Selected.Value
                                                            },
                                                            CapelaStatus: {
                                                                Value: DataCardValue99.Selected.Value
                                                            },
                                                            StatusGeral: {
                                                                Value: varStatusGeralLavagem
                                                            },
                                                            StatusNC: If(
                                                                varTemNC_Lavagem ||
                                                                Coalesce(varRegistroChecklist.StatusNC.Value, "") = "Pendente",
                                                                {
                                                                    Value: "Pendente"
                                                                },
                                                                {
                                                                    Value: "Concluído"
                                                                }
                                                            )
                                                        }
                                                    ),
                                                    Defaults(Checklist_OrganizacaoPellet2025)
                                                )
                                            );

                                            If(
                                                IsBlank(varRegistroChecklistAtualizadoLavagem.ID),
                                                Notify(
                                                    "❌ Erro ao salvar checklist da Lavagem. Verifique conexão ou permissão.",
                                                    NotificationType.Error
                                                );
                                                Set(varBusy, false),

                                                Set(varRegistroChecklist, varRegistroChecklistAtualizadoLavagem);

                                                If(
                                                    varTemNC_Lavagem,
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaNCLavagem,
                                                        ScreenTransition.Fade
                                                    ),
                                                    ResetForm(Form_Lavagem);
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaFinal,
                                                        ScreenTransition.Fade
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =24
                              Text: ="ENVIAR CHECK LIST"
                              Width: =Parent.Width - 60
                              X: =30
                              Y: =26

Screens:
  TelaFinal:
    Properties:
      Fill: =RGBA(238, 238, 238, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varBusy, false);
        Set(statusGeralCalc, Blank());
        Set(statusNCCalc, Blank());
        Set(qtdNc, 0);
        Set(varPossuiStatusNCInvalidoFinal, false);

        Clear(colNcChecklist);
        Clear(colNCAbertasChecklistAtualLocal);

        If(
            IsBlank(varRegistroChecklist) ||
            IsBlank(varRegistroChecklist.ID),

            Notify(
                "⚠️ Não existe checklist ativo para finalizar. Volte ao início e reinicie a inspeção.",
                NotificationType.Warning
            ),

            Refresh(NaoConformidadesPorSala);

            ClearCollect(
                colNcChecklist,
                Filter(
                    NaoConformidadesPorSala,
                    ChecklistID = varRegistroChecklist.ID
                )
            );

            Set(
                varPossuiStatusNCInvalidoFinal,
                !IsBlank(
                    LookUp(
                        colNcChecklist,
                        IsBlank(StatusNC.Value) ||
                        !(
                            StatusNC.Value = "Aberta" ||
                            StatusNC.Value = "Em Tratamento" ||
                            StatusNC.Value = "Encerrada" ||
                            StatusNC.Value = "Cancelada"
                        ),
                        ID
                    )
                )
            );

            If(
                varPossuiStatusNCInvalidoFinal,

                Notify(
                    "⚠️ Existe uma não conformidade com status vazio ou inesperado. Informe o Focal do Programa para regularização.",
                    NotificationType.Warning
                ),

                ClearCollect(
                    colNCAbertasChecklistAtualLocal,
                    Filter(
                        colNcChecklist,
                        StatusNC.Value <> "Encerrada"
                    )
                );

                Set(
                    qtdNc,
                    CountRows(colNCAbertasChecklistAtualLocal)
                );

                Set(
                    statusGeralCalc,
                    If(
                        qtdNc = 0,
                        "Conforme",
                        If(
                            CountIf(
                                colNCAbertasChecklistAtualLocal,
                                ClassificacaoNC.Value = "Crítica / Segurança"
                            ) > 0,
                            "Crítico",
                            "Atenção"
                        )
                    )
                );

                Set(
                    statusNCCalc,
                    If(
                        qtdNc = 0,
                        "Concluído",
                        "Pendente"
                    )
                )
            )
        )

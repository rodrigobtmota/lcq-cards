                  - DataCard7:
                      Control: TypedDataCard@1.0.7
                      Variant: BlankCard
                      Properties:
                        BorderColor: =RGBA(245, 245, 245, 1)
                        Fill: =RGBA(238,238,238,1)
                        Height: =120
                        Width: =1297
                        X: =0
                        Y: =1
                      Children:
                        - btnEnviarTelaFinal:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =Color.White
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: '=RGBA(0, 56, 168, 1) '
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =80
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(0, 90, 160, 1)
                              OnSelect: |-
                                =If(
                                    varBusy,

                                    Notify(
                                        "⏳ Aguarde, a finalização do checklist já está em processamento.",
                                        NotificationType.Information
                                    ),

                                    Set(varBusy, true);
                                    Set(varPodeFinalizarChecklist, true);
                                    Set(varErroFinalizarChecklist, false);
                                    Set(varPossuiStatusNCInvalidoFinal, false);
                                    Set(
                                        varRegistroChecklistAtualizadoTelaFinal,
                                        Defaults(Checklist_OrganizacaoPellet2025)
                                    );

                                    If(
                                        IsBlank(varRegistroChecklist) ||
                                        IsBlank(varRegistroChecklist.ID),

                                        Notify(
                                            "❌ Não existe checklist ativo para finalizar. Volte ao início e reinicie a inspeção.",
                                            NotificationType.Error
                                        );
                                        Set(varPodeFinalizarChecklist, false)
                                    );

                                    If(
                                        varPodeFinalizarChecklist,

                                        Refresh(NaoConformidadesPorSala);
                                        Refresh(Checklist_OrganizacaoPellet2025);

                                        ClearCollect(
                                            colNcChecklist,
                                            Filter(
                                                NaoConformidadesPorSala,
                                                ChecklistID = varRegistroChecklist.ID
                                            )
                                        );

                                        Set(
                                            varPossuiStatusNCInvalidoFinal,
                                            !IsBlank(
                                                LookUp(
                                                    colNcChecklist,
                                                    IsBlank(StatusNC.Value) ||
                                                    !(
                                                        StatusNC.Value = "Aberta" ||
                                                        StatusNC.Value = "Em Tratamento" ||
                                                        StatusNC.Value = "Encerrada" ||
                                                        StatusNC.Value = "Cancelada"
                                                    ),
                                                    ID
                                                )
                                            )
                                        );

                                        If(
                                            varPossuiStatusNCInvalidoFinal,

                                            Notify(
                                                "⚠️ Existe uma não conformidade com status vazio ou inesperado. Informe o Focal do Programa para regularização.",
                                                NotificationType.Warning
                                            );
                                            Set(varPodeFinalizarChecklist, false),

                                            ClearCollect(
                                                colNCAbertasChecklistAtualLocal,
                                                Filter(
                                                    colNcChecklist,
                                                    StatusNC.Value <> "Encerrada"
                                                )
                                            );

                                            Set(
                                                qtdNc,
                                                CountRows(colNCAbertasChecklistAtualLocal)
                                            );

                                            Set(
                                                statusGeralCalc,
                                                If(
                                                    qtdNc = 0,
                                                    "Conforme",
                                                    If(
                                                        CountIf(
                                                            colNCAbertasChecklistAtualLocal,
                                                            ClassificacaoNC.Value = "Crítica / Segurança"
                                                        ) > 0,
                                                        "Crítico",
                                                        "Atenção"
                                                    )
                                                )
                                            );

                                            Set(
                                                statusNCCalc,
                                                If(
                                                    qtdNc = 0,
                                                    "Concluído",
                                                    "Pendente"
                                                )
                                            )
                                        )
                                    );

                                    If(
                                        varPodeFinalizarChecklist,

                                        Set(
                                            varRegistroChecklistAtualizadoTelaFinal,
                                            IfError(
                                                Patch(
                                                    Checklist_OrganizacaoPellet2025,
                                                    LookUp(
                                                        Checklist_OrganizacaoPellet2025,
                                                        ID = varRegistroChecklist.ID
                                                    ),
                                                    {
                                                        StatusGeral: {
                                                            Value: statusGeralCalc
                                                        },
                                                        StatusNC: {
                                                            Value: statusNCCalc
                                                        }
                                                    }
                                                ),
                                                Blank()
                                            )
                                        );

                                        If(
                                            IsBlank(varRegistroChecklistAtualizadoTelaFinal.ID),

                                            Set(varErroFinalizarChecklist, true);
                                            Notify(
                                                "❌ Erro ao concluir o checklist. Verifique conexão, permissão ou opções das colunas.",
                                                NotificationType.Error
                                            ),

                                            Set(
                                                varRegistroChecklist,
                                                varRegistroChecklistAtualizadoTelaFinal
                                            )
                                        )
                                    );

                                    If(
                                        varPodeFinalizarChecklist &&
                                        !varErroFinalizarChecklist,

                                        ResetForm(Form_telaOrganizacao);
                                        ResetForm(Form_InicioSala);
                                        ResetForm(Form_telaFinal);
                                        ResetForm(Form_Telapellet);
                                        ResetForm(Form_Reserva);
                                        ResetForm(Form_Oficina);
                                        ResetForm(Form_Shelter);
                                        ResetForm(Form_Deposito1);
                                        ResetForm(Form_Lavagem);
                                        ResetForm(Form_Almoxarifado);

                                        Clear(colNCtemporarias);
                                        Clear(colNcChecklist);
                                        Clear(colNCAbertasChecklistAtualLocal);
                                        Clear(colNCcriadas);
                                        Clear(colErrosNC);
                                        Clear(colNCDuplicadas);
                                        Clear(colNCChecklistAtualLocal);

                                        Set(varTemNC_Organizacao, false);
                                        Set(varTemNC_Pellet, false);
                                        Set(varTemNC_ReservaTecnica, false);
                                        Set(varTemNC_OficinaAOL, false);
                                        Set(varTemNC_Almoxarifado, false);
                                        Set(varTemNC_Lavagem, false);
                                        Set(varTemNC_Shelter, false);
                                        Set(varTemNC_Deposito1, false);

                                        Set(varBusy, false);

                                        Notify(
                                            "✅ Checklist concluído com sucesso. Resultado: " &
                                            statusGeralCalc &
                                            " | NCs pendentes: " &
                                            qtdNc,
                                            NotificationType.Success
                                        );

                                        Set(varRegistroChecklist, Blank());

                                        Navigate(
                                            TelaInicio,
                                            ScreenTransition.Fade
                                        ),

                                        Set(varBusy, false)
                                    )
                                )
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =22
                              Text: |-
                                =If(
                                    varBusy,
                                    "FINALIZANDO...",
                                    "FINALIZAR CHECKLIST"
                                )
                              Width: =1233
                              X: =32
                              Y: =16

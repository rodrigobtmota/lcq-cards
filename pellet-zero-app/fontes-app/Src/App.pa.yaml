      Set(varBusyPDF, false);
      Set(varBusyAuditoria, false);
      Set(varResultadoAuditoria, Blank());

      Set(varMatrizClassificacaoNCValida, false);
      Set(varErroCarregamentoMatrizNC, false);

      Clear(colMatrizClassificacaoNCAtiva);

      IfError(
          Refresh(MatrizClassificacaoNC);
          ClearCollect(
              colMatrizClassificacaoNCAtiva,
              Filter(
                  MatrizClassificacaoNC,
                  Ativo.Value = "Sim"
              )
          );
          Set(
              varMatrizClassificacaoNCValida,
              CountRows(colMatrizClassificacaoNCAtiva) > 0
          ),
          Clear(colMatrizClassificacaoNCAtiva);
          Set(varErroCarregamentoMatrizNC, true);
          Set(varMatrizClassificacaoNCValida, false);
          Notify(
              "⚠️ Não foi possível carregar as regras ativas da MatrizClassificacaoNC. Quando aplicável, as NCs serão registradas em contingência para preservar a rastreabilidade.",
              NotificationType.Warning
          )
      );

      If(
          !varErroCarregamentoMatrizNC &&
          !varMatrizClassificacaoNCValida,
          Notify(
              "⚠️ A MatrizClassificacaoNC não possui itens ativos. Quando aplicável, as NCs serão registradas em contingência para preservar a rastreabilidade.",

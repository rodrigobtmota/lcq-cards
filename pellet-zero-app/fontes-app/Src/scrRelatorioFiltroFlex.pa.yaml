      - btnGerarPDF:
          Control: Classic/Button@2.2.0
          Properties:
            AccessibleLabel: ="Gerar relatório em PDF"
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            DisplayMode: |-
              =If(
                  varBusyPDF,
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            Height: =48
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |-
              =If(
                  varBusyPDF,

                  Notify(
                      "⏳ Aguarde, o PDF já está sendo gerado.",
                      NotificationType.Information
                  ),

                  If(
                      !IsBlank(dtIniFiltroRel.SelectedDate) &&
                      !IsBlank(dtFimFiltroRel.SelectedDate) &&
                      DateValue(dtIniFiltroRel.SelectedDate) > DateValue(dtFimFiltroRel.SelectedDate),

                      Notify(
                          "❌ A data inicial não pode ser maior que a data final.",
                          NotificationType.Error
                      ),

                      If(
                          ddSalaFiltroRel.Selected.Value = "TODAS" &&
                          IsBlank(dtIniFiltroRel.SelectedDate) &&
                          IsBlank(dtFimFiltroRel.SelectedDate),

                          Notify(
                              "⚠️ Para gerar o PDF, selecione uma sala ou informe um período.",
                              NotificationType.Warning
                          ),

                          Set(varBusyPDF, true);
                          Set(varLinkPDF, Blank());
                          Set(varRetornoPDF, Blank());

                          Set(
                              varParametrosPDF,
                              JSON(
                                  {
                                      SolicitadoPor: User().FullName,
                                      Sala: Coalesce(
                                          ddSalaFiltroRel.Selected.Value,
                                          "TODAS"
                                      ),
                                      DataIni: If(
                                          IsBlank(dtIniFiltroRel.SelectedDate),
                                          "SEM_DATA",
                                          Text(
                                              DateValue(dtIniFiltroRel.SelectedDate),
                                              "[$-en-US]yyyy-mm-dd"
                                          )
                                      ),
                                      DataFim: If(
                                          IsBlank(dtFimFiltroRel.SelectedDate),
                                          "SEM_DATA",
                                          Text(
                                              DateValue(dtFimFiltroRel.SelectedDate),
                                              "[$-en-US]yyyy-mm-dd"
                                          )
                                      )
                                  },
                                  JSONFormat.Compact
                              )
                          );

                          IfError(
                              Set(
                                  varRetornoPDF,
                                  RelatorioPDF_HistoricoInspecoes_JSON_V2.Run(
                                      varParametrosPDF
                                  )
                              );

                              Set(varBusyPDF, false);

                              If(
                                  Lower(Coalesce(varRetornoPDF.status, "")) = "sucesso" &&
                                  !IsBlank(varRetornoPDF.urlrelatorio),

                                  Set(varLinkPDF, varRetornoPDF.urlrelatorio);

                                  Notify(
                                      "✅ PDF gerado com sucesso.",
                                      NotificationType.Success
                                  );

                                  Launch(varLinkPDF),

                                  Notify(
                                      Coalesce(
                                          varRetornoPDF.mensagem,
                                          "⚠️ O fluxo executou, mas não retornou o link do relatório."
                                      ),
                                      NotificationType.Warning
                                  )
                              ),

                              Set(varBusyPDF, false);

                              Notify(
                                  "❌ Erro real ao acionar o fluxo: " &
                                  Coalesce(
                                      FirstError.Message,
                                      "mensagem não retornada pelo Power Apps"
                                  ),
                                  NotificationType.Error
                              )
                          )
                      )
                  )
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: |-
              =If(
                  varBusyPDF,
                  "GERANDO PDF...",
                  "📄 Gerar PDF"
              )
            X: =1100
            Y: =130

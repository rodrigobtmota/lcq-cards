Screens:
  TelaNCReservaTecnica:
    Properties:
      Fill: =RGBA(238, 238, 238, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varBusy, false);

        If(
            IsEmpty(colNCtemporarias),
            Notify(
                "⚠️ Não há NCs para tratar. Volte e revise o checklist.",
                NotificationType.Warning
            )
        );

        If(
            !varMatrizClassificacaoNCValida,
            Notify(
                "⚠️ A MatrizClassificacaoNC não foi carregada corretamente. As NCs serão registradas em contingência para preservar a rastreabilidade.",
                NotificationType.Warning
            )
        );

        If(
            CountIf(
                colNCtemporarias,
                IsBlank(ItemChecklistOrigem)
            ) > 0,
            Notify(
                "❌ Existe NC sem ItemChecklistOrigem. Volte ao checklist e reinicie esta etapa.",
                NotificationType.Error
            )
        )
    Children:
      - btnEnviarNCReservaTecnica:
          Control: Classic/Button@2.2.0
          Group: GroupbtnEnviar_2
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            DisplayMode: |-
              =If(
                  varBusy ||
                  IsEmpty(colNCtemporarias) ||
                  CountIf(
                      colNCtemporarias,
                      IsBlank(ItemChecklistOrigem)
                  ) > 0 ||
                  CountIf(
                      galDescricaoNCReservaTecnica.AllItems,
                      IsBlank(
                          Trim(txtDescricaoNCReserva.Text)
                      )
                  ) > 0,
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =RGBA(0, 56, 168, 1)
            Font: =Font.'Open Sans'
            Height: =90
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |-
              =If(
                  varBusy,

                  Notify(
                      "⏳ Aguarde, o registro das não conformidades já está em processamento.",
                      NotificationType.Information
                  ),

                  Set(varBusy, true);
                  Set(varErroTelaNCReservaTecnica, Blank());
                  Set(varQtdDescricoesSincronizadasReservaTecnica, 0);
                  Set(varQtdNCEnriquecidasReservaTecnica, 0);

                  Clear(colNCcriadas);
                  Clear(colErrosNC);
                  Clear(colNCDuplicadas);
                  Clear(colNCChecklistAtualLocal);
                  Clear(colNCAbertasChecklistAtualLocal);
                  Clear(colErrosMatrizNCReservaTecnica);

                  Set(
                      varPessoaLogadaSP,
                      {
                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                          Claims: "i:0#.f|membership|" &
                              Lower(
                                  Coalesce(
                                      varUserEmail,
                                      User().Email
                                  )
                              ),
                          DisplayName: Coalesce(
                              varUserNome,
                              User().FullName
                          ),
                          Email: Lower(
                              Coalesce(
                                  varUserEmail,
                                  User().Email
                              )
                          ),
                          Department: "",
                          JobTitle: "",
                          Picture: ""
                      }
                  );

                  If(
                      IsEmpty(colNCtemporarias),
                      Set(
                          varErroTelaNCReservaTecnica,
                          "❌ Não há NCs para salvar. A coleção está vazia."
                      )
                  );

                  If(
                      IsBlank(varErroTelaNCReservaTecnica) &&
                      (
                          IsBlank(varRegistroChecklist) ||
                          IsBlank(varRegistroChecklist.ID)
                      ),
                      Set(
                          varErroTelaNCReservaTecnica,
                          "❌ Não existe checklist ativo vinculado a estas NCs. Volte ao início e reinicie o checklist."
                      )
                  );

                  If(
                      IsBlank(varErroTelaNCReservaTecnica) &&
                      CountIf(
                          colNCtemporarias,
                          IsBlank(ItemChecklistOrigem)
                      ) > 0,
                      Set(
                          varErroTelaNCReservaTecnica,
                          "❌ Existe NC sem ItemChecklistOrigem. Volte ao checklist e reinicie esta etapa."
                      )
                  );

                  If(
                      IsBlank(varErroTelaNCReservaTecnica),
                      Set(
                          varQtdDescricoesSincronizadasReservaTecnica,
                          IfError(
                              CountRows(
                                  ForAll(
                                      galDescricaoNCReservaTecnica.AllItems As g,
                                      Patch(
                                          colNCtemporarias,
                                          LookUp(
                                              colNCtemporarias,
                                              ItemChecklistOrigem = g.ItemChecklistOrigem
                                          ),
                                          {
                                              DescricaoNC: Coalesce(
                                                  Trim(g.txtDescricaoNCReserva.Text),
                                                  ""
                                              )
                                          }
                                      )
                                  )
                              ),
                              -1
                          )
                      )
                  );

                  If(
                      IsBlank(varErroTelaNCReservaTecnica) &&
                      varQtdDescricoesSincronizadasReservaTecnica < 0,
                      Set(
                          varErroTelaNCReservaTecnica,
                          "❌ Erro ao sincronizar as descrições das NCs."
                      )
                  );

                  If(
                      IsBlank(varErroTelaNCReservaTecnica) &&
                      CountIf(
                          colNCtemporarias,
                          IsBlank(Trim(DescricaoNC))
                      ) > 0,
                      Set(
                          varErroTelaNCReservaTecnica,
                          "❌ Preencha a descrição de todas as não conformidades."
                      )
                  );

                  If(
                      IsBlank(varErroTelaNCReservaTecnica),
                      ForAll(
                          colNCtemporarias As n,
                          With(
                              {
                                  qtdRegrasAtivas: CountRows(
                                      Filter(
                                          colMatrizClassificacaoNCAtiva As m,
                                          m.Campo = n.ItemChecklistOrigem
                                      )
                                  ),
                                  regraNC: LookUp(
                                      colMatrizClassificacaoNCAtiva As m,
                                      m.Campo = n.ItemChecklistOrigem
                                  )
                              },
                              With(
                                  {
                                      regraValida:
                                          varMatrizClassificacaoNCValida &&
                                          qtdRegrasAtivas = 1 &&
                                          !IsBlank(regraNC.ID) &&
                                          !IsBlank(regraNC.Pilar.Value) &&
                                          !IsBlank(regraNC.ClassificacaoPadrao.Value) &&
                                          !IsBlank(regraNC.PrazoDias) &&
                                          !IsBlank(Trim(Coalesce(regraNC.PrazoOperacional, ""))) &&
                                          (
                                              (
                                                  regraNC.ClassificacaoPadrao.Value = "Baixa" &&
                                                  regraNC.PrazoDias = 15 &&
                                                  Trim(Coalesce(regraNC.PrazoOperacional, "")) = "15 dias corridos"
                                              ) ||
                                              (
                                                  regraNC.ClassificacaoPadrao.Value = "Média" &&
                                                  regraNC.PrazoDias = 10 &&
                                                  Trim(Coalesce(regraNC.PrazoOperacional, "")) = "10 dias corridos"
                                              ) ||
                                              (
                                                  regraNC.ClassificacaoPadrao.Value = "Alta" &&
                                                  regraNC.PrazoDias = 7 &&
                                                  Trim(Coalesce(regraNC.PrazoOperacional, "")) = "7 dias corridos"
                                              ) ||
                                              (
                                                  regraNC.ClassificacaoPadrao.Value = "Crítica / Segurança" &&
                                                  regraNC.PrazoDias = 0 &&
                                                  Trim(Coalesce(regraNC.PrazoOperacional, "")) = "Ação imediata"
                                              )
                                          )
                                  },
                                  If(
                                      !regraValida,
                                      Collect(
                                          colErrosMatrizNCReservaTecnica,
                                          {
                                              ItemChecklistOrigem: n.ItemChecklistOrigem,
                                              ItemNC: n.ItemNC,
                                              Motivo: If(
                                                  !varMatrizClassificacaoNCValida,
                                                  "Falha de carregamento da MatrizClassificacaoNC",
                                                  qtdRegrasAtivas = 0,
                                                  "Item sem correspondência ativa na MatrizClassificacaoNC",
                                                  qtdRegrasAtivas > 1,
                                                  "Mais de uma regra ativa encontrada para o item",
                                                  "Regra ativa incompleta ou incompatível com a classificação oficial"
                                              )
                                          }
                                      )
                                  )
                              )
                          )
                      )
                  );

                  If(
                      IsBlank(varErroTelaNCReservaTecnica),
                      Set(
                          varQtdNCEnriquecidasReservaTecnica,
                          IfError(
                              CountRows(
                                  ForAll(
                                      colNCtemporarias As n,
                                      With(
                                          {
                                              qtdRegrasAtivas: CountRows(
                                                  Filter(
                                                      colMatrizClassificacaoNCAtiva As m,
                                                      m.Campo = n.ItemChecklistOrigem
                                                  )
                                              ),
                                              regraNC: LookUp(
                                                  colMatrizClassificacaoNCAtiva As m,
                                                  m.Campo = n.ItemChecklistOrigem
                                              ),
                                              pilarFallback: Coalesce(
                                                  LookUp(
                                                      colMapaItens As mapa,
                                                      mapa.Campo = n.ItemChecklistOrigem,
                                                      mapa.Pilar
                                                  ),
                                                  n.Pilar
                                              ),
                                              dataAberturaNC: Coalesce(
                                                  n.DataCriacao,
                                                  Now()
                                              )
                                          },
                                          With(
                                              {
                                                  regraValida:
                                                      varMatrizClassificacaoNCValida &&
                                                      qtdRegrasAtivas = 1 &&
                                                      !IsBlank(regraNC.ID) &&
                                                      !IsBlank(regraNC.Pilar.Value) &&
                                                      !IsBlank(regraNC.ClassificacaoPadrao.Value) &&
                                                      !IsBlank(regraNC.PrazoDias) &&
                                                      !IsBlank(Trim(Coalesce(regraNC.PrazoOperacional, ""))) &&
                                                      (
                                                          (
                                                              regraNC.ClassificacaoPadrao.Value = "Baixa" &&
                                                              regraNC.PrazoDias = 15 &&
                                                              Trim(Coalesce(regraNC.PrazoOperacional, "")) = "15 dias corridos"
                                                          ) ||
                                                          (
                                                              regraNC.ClassificacaoPadrao.Value = "Média" &&
                                                              regraNC.PrazoDias = 10 &&
                                                              Trim(Coalesce(regraNC.PrazoOperacional, "")) = "10 dias corridos"
                                                          ) ||
                                                          (
                                                              regraNC.ClassificacaoPadrao.Value = "Alta" &&
                                                              regraNC.PrazoDias = 7 &&
                                                              Trim(Coalesce(regraNC.PrazoOperacional, "")) = "7 dias corridos"
                                                          ) ||
                                                          (
                                                              regraNC.ClassificacaoPadrao.Value = "Crítica / Segurança" &&
                                                              regraNC.PrazoDias = 0 &&
                                                              Trim(Coalesce(regraNC.PrazoOperacional, "")) = "Ação imediata"
                                                          )
                                                      )
                                              },
                                              Patch(
                                                  colNCtemporarias,
                                                  n,
                                                  {
                                                      ResponsavelSala: If(
                                                          IsEmpty(n.ResponsavelSala),
                                                          Table(varPessoaLogadaSP),
                                                          n.ResponsavelSala
                                                      ),
                                                      Ciclo: Coalesce(
                                                          n.Ciclo,
                                                          varRegistroChecklist.Ciclo,
                                                          varCicloAtual
                                                      ),
                                                      OrigemNC: Coalesce(
                                                          n.OrigemNC,
                                                          "Checklist"
                                                      ),
                                                      DataCriacao: dataAberturaNC,
                                                      DataLimiteCorrecao: DateAdd(
                                                          dataAberturaNC,
                                                          If(
                                                              regraValida,
                                                              regraNC.PrazoDias,
                                                              10
                                                          ),
                                                          TimeUnit.Days
                                                      ),
                                                      Pilar: If(
                                                          regraValida,
                                                          regraNC.Pilar.Value,
                                                          pilarFallback
                                                      ),
                                                      ClassificacaoNC: If(
                                                          regraValida,
                                                          regraNC.ClassificacaoPadrao.Value,
                                                          "Média"
                                                      ),
                                                      PrazoDias: If(
                                                          regraValida,
                                                          regraNC.PrazoDias,
                                                          10
                                                      ),
                                                      PrazoOperacional: If(
                                                          regraValida,
                                                          regraNC.PrazoOperacional,
                                                          "10 dias corridos"
                                                      ),
                                                      ExigeEvidencia: If(
                                                          regraValida,
                                                          Coalesce(
                                                              regraNC.ExigeEvidencia.Value,
                                                              "Não"
                                                          ),
                                                          "Não"
                                                      )
                                                  }
                                              )
                                          )
                                      )
                                  )
                              ),
                              -1
                          )
                      )
                  );

                  If(
                      IsBlank(varErroTelaNCReservaTecnica) &&
                      varQtdNCEnriquecidasReservaTecnica < 0,
                      Set(
                          varErroTelaNCReservaTecnica,
                          "❌ Erro ao preparar as regras das NCs."
                      )
                  );

                  If(
                      IsBlank(varErroTelaNCReservaTecnica),
                      Switch(
                          true,
                          CountIf(colNCtemporarias, IsEmpty(ResponsavelSala)) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem responsável da sala."),
                          CountIf(colNCtemporarias, IsBlank(ChecklistID)) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem ChecklistID."),
                          CountIf(colNCtemporarias, IsBlank(ItemChecklistOrigem)) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem ItemChecklistOrigem."),
                          CountIf(colNCtemporarias, IsBlank(SalaNC)) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem sala vinculada."),
                          CountIf(colNCtemporarias, IsBlank(Ciclo)) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem ciclo vinculado."),
                          CountIf(colNCtemporarias, IsBlank(Pilar)) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem pilar definido em colMapaItens."),
                          CountIf(colNCtemporarias, IsBlank(ClassificacaoNC)) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem classificação definida."),
                          CountIf(colNCtemporarias, IsBlank(PrazoDias)) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem prazo numérico definido."),
                          CountIf(colNCtemporarias, IsBlank(Trim(PrazoOperacional))) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem prazo operacional definido."),
                          CountIf(colNCtemporarias, IsBlank(DataLimiteCorrecao)) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem data limite calculada."),
                          CountIf(colNCtemporarias, IsBlank(OrigemNC)) > 0,
                          Set(varErroTelaNCReservaTecnica, "❌ Há NC sem origem definida.")
                      )
                  );

                  If(
                      !IsBlank(varErroTelaNCReservaTecnica),

                      Notify(
                          varErroTelaNCReservaTecnica,
                          NotificationType.Error
                      );
                      Set(varBusy, false),

                      If(
                          !IsEmpty(colErrosMatrizNCReservaTecnica),
                          Notify(
                              "⚠️ Existem itens que serão registrados em contingência com classificação Média e prazo de 10 dias: " &
                                  Concat(
                                      colErrosMatrizNCReservaTecnica,
                                      ItemChecklistOrigem & " — " & Motivo,
                                      " | "
                                  ),
                              NotificationType.Warning
                          )
                      );

                      ForAll(
                          colNCtemporarias As r,
                          With(
                              {
                                  qtdRegrasAtivas: CountRows(
                                      Filter(
                                          colMatrizClassificacaoNCAtiva As m,
                                          m.Campo = r.ItemChecklistOrigem
                                      )
                                  ),
                                  regraNC: LookUp(
                                      colMatrizClassificacaoNCAtiva As m,
                                      m.Campo = r.ItemChecklistOrigem
                                  ),
                                  dataAberturaNC: Coalesce(
                                      r.DataCriacao,
                                      Now()
                                  )
                              },
                              With(
                                  {
                                      regraValida:
                                          varMatrizClassificacaoNCValida &&
                                          qtdRegrasAtivas = 1 &&
                                          !IsBlank(regraNC.ID) &&
                                          !IsBlank(regraNC.Pilar.Value) &&
                                          !IsBlank(regraNC.ClassificacaoPadrao.Value) &&
                                          !IsBlank(regraNC.PrazoDias) &&
                                          !IsBlank(Trim(Coalesce(regraNC.PrazoOperacional, ""))) &&
                                          (
                                              (
                                                  regraNC.ClassificacaoPadrao.Value = "Baixa" &&
                                                  regraNC.PrazoDias = 15 &&
                                                  Trim(Coalesce(regraNC.PrazoOperacional, "")) = "15 dias corridos"
                                              ) ||
                                              (
                                                  regraNC.ClassificacaoPadrao.Value = "Média" &&
                                                  regraNC.PrazoDias = 10 &&
                                                  Trim(Coalesce(regraNC.PrazoOperacional, "")) = "10 dias corridos"
                                              ) ||
                                              (
                                                  regraNC.ClassificacaoPadrao.Value = "Alta" &&
                                                  regraNC.PrazoDias = 7 &&
                                                  Trim(Coalesce(regraNC.PrazoOperacional, "")) = "7 dias corridos"
                                              ) ||
                                              (
                                                  regraNC.ClassificacaoPadrao.Value = "Crítica / Segurança" &&
                                                  regraNC.PrazoDias = 0 &&
                                                  Trim(Coalesce(regraNC.PrazoOperacional, "")) = "Ação imediata"
                                              )
                                          )
                                  },
                                  If(
                                      !IsBlank(
                                          LookUp(
                                              NaoConformidadesPorSala,
                                              ChecklistID = r.ChecklistID &&
                                              ItemChecklistOrigem = r.ItemChecklistOrigem
                                          )
                                      ),
                                      Collect(
                                          colNCDuplicadas,
                                          {
                                              ItemChecklistOrigem: r.ItemChecklistOrigem,
                                              ItemNC: r.ItemNC,
                                              Motivo: "NC já existente para este checklist e item."
                                          }
                                      ),
                                      IfError(
                                          Collect(
                                              colNCcriadas,
                                              Patch(
                                                  NaoConformidadesPorSala,
                                                  Defaults(NaoConformidadesPorSala),
                                                  {
                                                      Título: r.ItemNC,
                                                      ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                      SalaNC: {
                                                          Value: r.SalaNC
                                                      },
                                                      StatusNC: {
                                                          Value: "Aberta"
                                                      },
                                                      StatusAtribuicaoNC: {
                                                          Value: "Pendente"
                                                      },
                                                      ResponsavelOriginal: r.ResponsavelSala,
                                                      ResponsavelSala: r.ResponsavelSala,
                                                      DescricaoNC: r.DescricaoNC,
                                                      ChecklistID: r.ChecklistID,
                                                      Ciclo: Coalesce(
                                                          r.Ciclo,
                                                          varRegistroChecklist.Ciclo,
                                                          varCicloAtual
                                                      ),
                                                      'DataCriacao ': dataAberturaNC,
                                                      DataLimiteCorrecao: DateAdd(
                                                          dataAberturaNC,
                                                          If(
                                                              regraValida,
                                                              regraNC.PrazoDias,
                                                              10
                                                          ),
                                                          TimeUnit.Days
                                                      ),
                                                      OrigemNC: {
                                                          Value: r.OrigemNC
                                                      },
                                                      Pilar: {
                                                          Value: r.Pilar
                                                      },
                                                      ClassificacaoNC: {
                                                          Value: If(
                                                              regraValida,
                                                              regraNC.ClassificacaoPadrao.Value,
                                                              "Média"
                                                          )
                                                      },
                                                      PrazoDiasAplicado: If(
                                                          regraValida,
                                                          regraNC.PrazoDias,
                                                          10
                                                      ),
                                                      PrazoOperacionalAplicado: If(
                                                          regraValida,
                                                          regraNC.PrazoOperacional,
                                                          "10 dias corridos"
                                                      ),
                                                      ExigeEvidenciaAplicada: If(
                                                          regraValida,
                                                          Coalesce(
                                                              regraNC.ExigeEvidencia.Value,
                                                              "Não"
                                                          ) = "Sim",
                                                          false
                                                      ),
                                                      MatrizClassificacaoID: If(
                                                          regraValida,
                                                          regraNC.ID,
                                                          Blank()
                                                      ),
                                                      StatusClassificacaoNC: {
                                                          Value: If(
                                                              regraValida,
                                                              "Classificada",
                                                              "Contingência de matriz"
                                                          )
                                                      },
                                                      DetalheFalhaClassificacaoNC: If(
                                                          regraValida,
                                                          Blank(),
                                                          If(
                                                              !varMatrizClassificacaoNCValida,
                                                              "Falha de carregamento da MatrizClassificacaoNC",
                                                              qtdRegrasAtivas = 0,
                                                              "Item sem correspondência ativa na MatrizClassificacaoNC",
                                                              qtdRegrasAtivas > 1,
                                                              "Mais de uma regra ativa encontrada para o item",
                                                              "Regra ativa incompleta ou incompatível com a classificação oficial"
                                                          )
                                                      ),
                                                      StatusValidacaoCritica: {
                                                          Value: If(
                                                              regraValida &&
                                                              regraNC.ClassificacaoPadrao.Value = "Crítica / Segurança",
                                                              "Pendente",
                                                              "Não aplicável"
                                                          )
                                                      },
                                                      EvidenciaRegistrada: false,
                                                      AvisoInicialAcaoEnviado: false,
                                                      AvisoPreVencimentoEnviado: false,
                                                      AvisoVencidoEnviado: false,
                                                      ReenviosAvisoPreVencimento: 0,
                                                      ReenviosAvisoVencido: 0,
                                                      ConclusaoComAtraso: false
                                                  }
                                              )
                                          ),
                                          Collect(
                                              colErrosNC,
                                              {
                                                  ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                  ItemNC: r.ItemNC,
                                                  Erro: Coalesce(
                                                      FirstError.Message,
                                                      "Erro desconhecido ao criar a NC."
                                                  )
                                              }
                                          )
                                      )
                                  )
                              )
                          )
                      )
                  );

                  If(
                      !IsEmpty(colErrosNC),

                      Notify(
                          "❌ Não foi possível registrar todas as NCs. Exemplo: " &
                              First(colErrosNC).ItemNC &
                              " — " &
                              First(colErrosNC).Erro &
                              ". Os itens já criados serão reconhecidos como duplicados em uma nova tentativa.",
                          NotificationType.Error
                      );
                      Set(varBusy, false),

                      If(
                          IsEmpty(colNCcriadas) &&
                          IsEmpty(colNCDuplicadas),

                          Notify(
                              "❌ Nenhuma NC foi criada. Verifique os dados antes de continuar.",
                              NotificationType.Error
                          );
                          Set(varBusy, false),

                          Refresh(NaoConformidadesPorSala);

                          ClearCollect(
                              colNCChecklistAtualLocal,
                              Filter(
                                  NaoConformidadesPorSala,
                                  ChecklistID = varRegistroChecklist.ID
                              )
                          );

                          ClearCollect(
                              colNCAbertasChecklistAtualLocal,
                              Filter(
                                  colNCChecklistAtualLocal,
                                  StatusNC.Value <> "Encerrada"
                              )
                          );

                          Set(
                              varQtdNCChecklistAtual,
                              CountRows(colNCAbertasChecklistAtualLocal)
                          );

                          Set(
                              varStatusGeralChecklistAtual,
                              If(
                                  varQtdNCChecklistAtual = 0,
                                  "Conforme",
                                  If(
                                      CountIf(
                                          colNCAbertasChecklistAtualLocal,
                                          ClassificacaoNC.Value = "Crítica / Segurança"
                                      ) > 0,
                                      "Crítico",
                                      "Atenção"
                                  )
                              )
                          );

                          Set(
                              varAtualizacaoChecklistReservaTecnicaOk,
                              IfError(
                                  Set(
                                      varRegistroChecklist,
                                      Patch(
                                          Checklist_OrganizacaoPellet2025,
                                          LookUp(
                                              Checklist_OrganizacaoPellet2025,
                                              ID = varRegistroChecklist.ID
                                          ),
                                          {
                                              StatusNC: If(
                                                  varQtdNCChecklistAtual = 0,
                                                  {
                                                      Value: "Concluído"
                                                  },
                                                  {
                                                      Value: "Pendente"
                                                  }
                                              ),
                                              StatusGeral: {
                                                  Value: varStatusGeralChecklistAtual
                                              }
                                          }
                                      )
                                  ),
                                  Notify(
                                      "⚠️ As NCs foram registradas, mas houve falha ao atualizar o status do checklist principal.",
                                      NotificationType.Warning
                                  );
                                  false
                              )
                          );

                          Notify(
                              "✅ NC(s) registradas com sucesso! Criadas: " &
                                  CountRows(colNCcriadas) &
                                  If(
                                      CountRows(colNCDuplicadas) > 0,
                                      " | Duplicadas ignoradas: " &
                                          CountRows(colNCDuplicadas),
                                      ""
                                  ),
                              NotificationType.Success
                          );

                          Clear(colNCtemporarias);
                          Set(varBusy, false);

                          Navigate(
                              TelaFinal,
                              ScreenTransition.Fade
                          )
                      )
                  )
              )
            PaddingLeft: =30

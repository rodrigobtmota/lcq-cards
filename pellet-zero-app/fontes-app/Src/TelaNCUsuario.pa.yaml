                  - btnEnviarTratativa:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        DisplayMode: |-
                          =If(
                              varBusy ||
                              IsBlank(ThisItem.ID) ||
                              IsBlank(ThisItem.ChecklistID) ||
                              IsBlank(Trim(txtAcaoCorretivaResponsavel.Text)) ||
                              !(
                                  Coalesce(ThisItem.StatusClassificacaoNC.Value, "") = "Classificada" ||
                                  Coalesce(ThisItem.StatusClassificacaoNC.Value, "") = "Regularizada" ||
                                  Coalesce(ThisItem.StatusClassificacaoNC.Value, "") = "Contingência de matriz"
                              ),
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Fill: =RGBA(0, 56, 168, 1)
                        Font: =Font.'Open Sans'
                        Height: =56
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(16, 110, 190, 1)
                        OnSelect: |-
                          =If(
                              varBusy,

                              Notify(
                                  "⏳ Aguarde, a tratativa da NC já está em processamento.",
                                  NotificationType.Information
                              ),

                              Set(varBusy, true);
                              Set(varPodeConcluirNC, true);
                              Set(varErroConcluirNC, false);
                              Set(varChecklistIdAtual, 0);
                              Set(
                                  varNcAtualizada,
                                  Defaults(NaoConformidadesPorSala)
                              );
                              Set(varExistePendente, false);
                              Set(varQtdPendenciasChecklist, 0);
                              Set(varStatusGeralChecklistAtual, "");
                              Set(varPossuiStatusNCInvalidoTratativa, false);
                              Set(
                                  varChecklistAtualizadoAposTratativa,
                                  Defaults(Checklist_OrganizacaoPellet2025)
                              );

                              Clear(colNcPendentesMesmoChecklist);
                              Clear(colNcMesmoChecklistTratativa);

                              If(
                                  IsBlank(ThisItem.ID) ||
                                  IsBlank(ThisItem.ChecklistID),

                                  Notify(
                                      "❌ Item inválido. A NC está sem ID ou sem ChecklistID.",
                                      NotificationType.Error
                                  );
                                  Set(varPodeConcluirNC, false)
                              );

                              If(
                                  varPodeConcluirNC &&
                                  IsBlank(
                                      Trim(txtAcaoCorretivaResponsavel.Text)
                                  ),

                                  Notify(
                                      "❌ Preencha a ação corretiva antes de concluir.",
                                      NotificationType.Error
                                  );
                                  Set(varPodeConcluirNC, false)
                              );

                              If(
                                  varPodeConcluirNC &&
                                  !(
                                      Coalesce(
                                          ThisItem.StatusClassificacaoNC.Value,
                                          ""
                                      ) = "Classificada" ||
                                      Coalesce(
                                          ThisItem.StatusClassificacaoNC.Value,
                                          ""
                                      ) = "Regularizada" ||
                                      Coalesce(
                                          ThisItem.StatusClassificacaoNC.Value,
                                          ""
                                      ) = "Contingência de matriz"
                                  ),

                                  Notify(
                                      "❌ Esta NC ainda não possui uma classificação operacional válida para encerramento.",
                                      NotificationType.Error
                                  );
                                  Set(varPodeConcluirNC, false)
                              );

                              If(
                                  varPodeConcluirNC,

                                  Set(
                                      varChecklistIdAtual,
                                      Value(ThisItem.ChecklistID)
                                  )
                              );

                              If(
                                  varPodeConcluirNC &&
                                  (
                                      IsBlank(varChecklistIdAtual) ||
                                      varChecklistIdAtual = 0
                                  ),

                                  Notify(
                                      "❌ ChecklistID inválido: " &
                                      Text(ThisItem.ChecklistID),
                                      NotificationType.Error
                                  );
                                  Set(varPodeConcluirNC, false)
                              );

                              If(
                                  varPodeConcluirNC,

                                  Set(
                                      varNcAtualizada,
                                      IfError(
                                          Patch(
                                              NaoConformidadesPorSala,
                                              LookUp(
                                                  NaoConformidadesPorSala,
                                                  ID = ThisItem.ID
                                              ),
                                              {
                                                  AcaoCorretivaResponsavel: Trim(
                                                      txtAcaoCorretivaResponsavel.Text
                                                  ),
                                                  StatusNC: {
                                                      Value: "Encerrada"
                                                  },
                                                  DataFinalCorretiva: Now(),
                                                  ResponsavelFinalCorretiva: {
                                                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                      Claims: "i:0#.f|membership|" &
                                                          Lower(
                                                              Coalesce(
                                                                  varUserEmail,
                                                                  User().Email
                                                              )
                                                          ),
                                                      DisplayName: Coalesce(
                                                          varUserNome,
                                                          User().FullName
                                                      ),
                                                      Email: Lower(
                                                          Coalesce(
                                                              varUserEmail,
                                                              User().Email
                                                          )
                                                      ),
                                                      Department: "",
                                                      JobTitle: "",
                                                      Picture: ""
                                                  },
                                                  ConclusaoComAtraso: If(
                                                      IsBlank(ThisItem.DataLimiteCorrecao),
                                                      false,
                                                      Now() > ThisItem.DataLimiteCorrecao
                                                  )
                                              }
                                          ),
                                          Defaults(NaoConformidadesPorSala)
                                      )
                                  );

                                  If(
                                      IsBlank(varNcAtualizada.ID),

                                      Set(varErroConcluirNC, true);
                                      Notify(
                                          "❌ Erro ao concluir a NC. Verifique permissões, conexão ou colunas da lista.",
                                          NotificationType.Error
                                      )
                                  )
                              );

                              If(
                                  varPodeConcluirNC &&
                                  !varErroConcluirNC,

                                  Refresh(NaoConformidadesPorSala);

                                  ClearCollect(
                                      colNcMesmoChecklistTratativa,
                                      Filter(
                                          NaoConformidadesPorSala,
                                          ChecklistID = varChecklistIdAtual
                                      )
                                  );

                          Set(
                              varPossuiStatusNCInvalidoTratativa,
                              !IsBlank(
                                  LookUp(
                                      colNcMesmoChecklistTratativa,
                                      IsBlank(StatusNC.Value) ||
                                      !(
                                          StatusNC.Value = "Aberta" ||
                                          StatusNC.Value = "Em Tratamento" ||
                                          StatusNC.Value = "Encerrada" ||
                                          StatusNC.Value = "Cancelada"
                                      ),
                                      ID
                                  )
                              )
                          );

                          ClearCollect(
                              colNcPendentesMesmoChecklist,
                              Filter(
                                  colNcMesmoChecklistTratativa,
                                  StatusNC.Value <> "Encerrada"
                              )
                          );

                          Set(
                              varQtdPendenciasChecklist,
                              CountRows(colNcPendentesMesmoChecklist)
                          );

                          Set(
                              varExistePendente,
                              varQtdPendenciasChecklist > 0 ||
                              varPossuiStatusNCInvalidoTratativa
                          );

                          Set(
                              varStatusGeralChecklistAtual,
                              If(
                                  !varExistePendente,
                                  "Conforme",
                                  If(
                                      CountIf(
                                          colNcPendentesMesmoChecklist,
                                          ClassificacaoNC.Value = "Crítica / Segurança"
                                      ) > 0,
                                      "Crítico",
                                      "Atenção"
                                  )
                              )
                          );

                                  If(
                                      varPossuiStatusNCInvalidoTratativa,

                                      Notify(
                                          "⚠️ Existe NC vinculada a este checklist com status vazio ou inesperado. O checklist principal permanecerá pendente até regularização.",
                                          NotificationType.Warning
                                      )
                                  );

                                  Set(
                                      varChecklistAtualizadoAposTratativa,
                                      IfError(
                                          Patch(
                                              Checklist_OrganizacaoPellet2025,
                                              LookUp(
                                                  Checklist_OrganizacaoPellet2025,
                                                  ID = varChecklistIdAtual
                                              ),
                                              {
                                                  StatusNC: If(
                                                      varExistePendente,
                                                      {
                                                          Value: "Pendente"
                                                      },
                                                      {
                                                          Value: "Concluído"
                                                      }
                                                  ),
                                                  StatusGeral: {
                                                      Value: varStatusGeralChecklistAtual
                                                  }
                                              }
                                          ),
                                          Defaults(Checklist_OrganizacaoPellet2025)
                                      )
                                  );

                                  If(
                                      IsBlank(
                                          varChecklistAtualizadoAposTratativa.ID
                                      ),

                                      Notify(
                                          "⚠️ NC concluída, mas houve falha ao atualizar o checklist principal.",
                                          NotificationType.Warning
                                      ),

                                      If(
                                          !IsBlank(varRegistroChecklist) &&
                                          varRegistroChecklist.ID =
                                              varChecklistIdAtual,

                                          Set(
                                              varRegistroChecklist,
                                              varChecklistAtualizadoAposTratativa
                                          )
                                      )
                                  );

                                  Refresh(Checklist_OrganizacaoPellet2025);
                                  Refresh(NaoConformidadesPorSala);
                                  Reset(txtAcaoCorretivaResponsavel);

                                  If(
                                      varPossuiStatusNCInvalidoTratativa,

                                      Notify(
                                          "✅ NC concluída. O checklist permanece pendente porque existe NC com status que precisa ser regularizado.",
                                          NotificationType.Success
                                      ),

                                      If(
                                          varExistePendente,

                                          Notify(
                                              "✅ NC concluída. Ainda existem " &
                                              varQtdPendenciasChecklist &
                                              " NC(s) aberta(s) ou em tratamento neste checklist.",
                                              NotificationType.Success
                                          ),

                                          Notify(
                                              "✅ NC concluída. Checklist sem pendências de NC.",
                                              NotificationType.Success
                                          )
                                      )
                                  );

                                  Clear(colNcPendentesMesmoChecklist);
                                  Clear(colNcMesmoChecklistTratativa)
                              );

                              Set(varBusy, false)
                          )
                        PaddingLeft: =30
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)

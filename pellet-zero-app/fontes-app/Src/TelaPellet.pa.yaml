                                                    Patch(
                                                        Checklist_OrganizacaoPellet2025,
                                                        varRegistroChecklist,
                                                        {
                                                            AcessoriosDisponiveis: {Value: DataCardValue51.Selected.Value},
                                                            AmostrasTampa: {Value: DataCardValue52.Selected.Value},
                                                            BancadasLimpas: {Value: DataCardValue53.Selected.Value},
                                                            BarreirasPellet: {Value: DataCardValue54.Selected.Value},
                                                            ColetorOk: {Value: DataCardValue55.Selected.Value},
                                                            ExtrusaoLimpa: {Value: DataCardValue56.Selected.Value},
                                                            PelletAusente: {Value: DataCardValue57.Selected.Value},
                                                            PrateleirasLimpas: {Value: DataCardValue58.Selected.Value},
                                                            SacosArmazenados: {Value: DataCardValue59.Selected.Value},
                                                            VarreduraOk: {Value: DataCardValue60.Selected.Value},

                                                            StatusGeral: {Value: varStatusGeralPellet},


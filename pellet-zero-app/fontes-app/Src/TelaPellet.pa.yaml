                                                                        pilarFallback
                                                                    ),
                                                                    ClassificacaoNC: If(
                                                                        regraValida,
                                                                        regraNC.ClassificacaoPadrao.Value,
                                                                        "Média"
                                                                    ),
                                                                    PrazoDias: If(

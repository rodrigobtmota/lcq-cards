                                                ),

                                                Set(varErroSalvarPellet, true);
                                                Notify(
                                                    "❌ Erro ao salvar checklist Pellet. Verifique conexão ou permissão.",
                                                    NotificationType.Error
                                                );
                                                Set(varBusy, false)
                                            );

                                            If(

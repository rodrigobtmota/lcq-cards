                  - DataCard6:
                      Control: TypedDataCard@1.0.7
                      Variant: BlankCard
                      Properties:
                        BorderColor: =RGBA(244, 244, 244, 1)
                        DisplayMode: =Parent.DisplayMode
                        Fill: =RGBA(238,238,238,1)
                        Height: =150
                        Width: =Parent.Width
                        X: =0
                        Y: =7
                      Children:
                        - btnEnviarTelaDeposito:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =Color.White
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: |+
                                =// =======================================================
                                // TelaDeposito - BtnEnviar.DisplayMode (CORRETO)
                                // =======================================================

                                If(
                                    varBusy,
                                    DisplayMode.Disabled,
                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),

                                            IsBlank(DataCardValue90.Selected.Value),
                                            IsBlank(DataCardValue91.Selected.Value),
                                            IsBlank(DataCardValue92.Selected.Value),
                                            IsBlank(DataCardValue93.Selected.Value),
                                            IsBlank(DataCardValue94.Selected.Value),
                                            IsBlank(DataCardValue95.Selected.Value),
                                            IsBlank(DataCardValue96.Selected.Value)
                                        ),
                                        DisplayMode.Disabled,
                                        DisplayMode.Edit
                                    )
                                )
                              Fill: '=RGBA(0, 56, 168, 1) '
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =98
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(0, 90, 160, 1)
                              OnSelect: |-
                                =If(
                                    varBusy,
                                    Blank(),

                                    Set(varBusy, true);
                                    Set(varRodizioValidado, true);
                                    Set(
                                        varRegistroChecklistAtualizadoDeposito,
                                        Defaults(Checklist_OrganizacaoPellet2025)
                                    );

                                    Clear(colRodizioSalaAtual);
                                    Clear(colNcDeposito1);
                                    Clear(colNCtemporarias);

                                    Set(
                                        varPessoaLogadaSP,
                                        {
                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims: "i:0#.f|membership|" & Lower(Coalesce(varUserEmail, User().Email)),
                                            DisplayName: Coalesce(varUserNome, User().FullName),
                                            Email: Lower(Coalesce(varUserEmail, User().Email)),
                                            Department: "",
                                            JobTitle: "",
                                            Picture: ""
                                        }
                                    );

                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),
                                            IsBlank(DataCardValue90.Selected.Value),
                                            IsBlank(DataCardValue91.Selected.Value),
                                            IsBlank(DataCardValue92.Selected.Value),
                                            IsBlank(DataCardValue93.Selected.Value),
                                            IsBlank(DataCardValue94.Selected.Value),
                                            IsBlank(DataCardValue95.Selected.Value),
                                            IsBlank(DataCardValue96.Selected.Value)
                                        ),

                                        Notify(
                                            "❌ Preencha todos os campos obrigatórios.",
                                            NotificationType.Error
                                        );
                                        Set(varBusy, false),

                                        Set(
                                            varTemNC_Deposito1,
                                            Or(
                                                DataCardValue90.Selected.Value = "Não Conforme",
                                                DataCardValue91.Selected.Value = "Não Conforme",
                                                DataCardValue92.Selected.Value = "Não Conforme",
                                                DataCardValue93.Selected.Value = "Não Conforme",
                                                DataCardValue94.Selected.Value = "Não Conforme",
                                                DataCardValue95.Selected.Value = "Não Conforme",
                                                DataCardValue96.Selected.Value = "Não Conforme"
                                            )
                                        );

                                        ClearCollect(
                                            colNcDeposito1,
                                            Filter(
                                                Table(
                                                    {
                                                        ItemChecklistOrigem: ChaoLivreDeposito1_DataCard1.DataField,
                                                        ItemNC: "Ausência de materiais no chão?",
                                                        Valor: DataCardValue90.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: PrateleirasOrgDeposito1_DataCard1.DataField,
                                                        ItemNC: "Prateleiras estão organizadas por categoria?",
                                                        Valor: DataCardValue91.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: EtiquetasOkDeposito1_DataCard1.DataField,
                                                        ItemNC: "Todos os itens estão identificados com etiquetas padronizadas?",
                                                        Valor: DataCardValue92.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: EquipamentosIdentificacao1_DataCard1.DataField,
                                                        ItemNC: "Equipamentos possuem etiquetas de identificação visíveis?",
                                                        Valor: DataCardValue93.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: DescarteDeposito1_DataCard1.DataField,
                                                        ItemNC: "Itens danificados ou para descarte estão sinalizados com etiqueta?",
                                                        Valor: DataCardValue94.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: PlataformaDeposito1_DataCard1.DataField,
                                                        ItemNC: "Plataforma metálica do segundo andar está estável e sem danos?",
                                                        Valor: DataCardValue95.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: PrateleirasFirmes1_DataCard1.DataField,
                                                        ItemNC: "Prateleiras estão firmes e sem sobrecarga?",
                                                        Valor: DataCardValue96.Selected.Value
                                                    }
                                                ),
                                                Valor = "Não Conforme"
                                            )
                                        );

                                        Set(
                                            varQtdNCDeposito1,
                                            CountRows(colNcDeposito1)
                                        );

                                        If(
                                            varTemNC_Deposito1,

                                            ClearCollect(
                                                colRodizioSalaAtual,
                                                Filter(
                                                    RodizioPlanejado,
                                                    Sala.Value = varRegistroChecklist.Sala.Value &&
                                                    Publicado = true &&
                                                    StatusRodizio.Value = "Ativo" &&
                                                    InicioRodizio <= Today() &&
                                                    FimRodizio >= Today()
                                                )
                                            );

                                            If(
                                                CountRows(colRodizioSalaAtual) > 1,

                                                Notify(
                                                    "❌ Existe mais de um rodízio ativo publicado para esta sala. Corrija a lista RodizioPlanejado antes de continuar.",
                                                    NotificationType.Error
                                                );
                                                Set(varRodizioValidado, false),

                                                CountRows(colRodizioSalaAtual) = 0,

                                                Set(varRodizioSala, Blank());
                                                Set(varResponsaveisNCDeposito, Table(varPessoaLogadaSP));
                                                Notify(
                                                    "⚠️ Nenhum rodízio ativo publicado foi encontrado. A NC será registrada provisoriamente para o usuário logado.",
                                                    NotificationType.Warning
                                                ),

                                                Set(varRodizioSala, First(colRodizioSalaAtual));
                                                If(
                                                    CountRows(varRodizioSala.ResponsavelSala) = 0,
                                                    Set(varResponsaveisNCDeposito, Table(varPessoaLogadaSP));
                                                    Notify(
                                                        "⚠️ Rodízio ativo encontrado, mas sem responsável cadastrado. A NC será registrada provisoriamente para o usuário logado.",
                                                        NotificationType.Warning
                                                    ),
                                                    Set(varResponsaveisNCDeposito, varRodizioSala.ResponsavelSala)
                                                )
                                            );

                                            If(
                                                varRodizioValidado,
                                                ClearCollect(
                                                    colNCtemporarias,
                                                    ForAll(
                                                        colNcDeposito1 As r,
                                                        {
                                                            ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                            ItemNC: r.ItemNC,
                                                            Pilar: LookUp(
                                                                colMapaItens As mapa,
                                                                mapa.Campo = r.ItemChecklistOrigem,
                                                                mapa.Pilar
                                                            ),
                                                            OrigemNC: "Checklist",
                                                            SalaNC: varRegistroChecklist.Sala.Value,
                                                            ChecklistID: varRegistroChecklist.ID,
                                                            Ciclo: Coalesce(varRegistroChecklist.Ciclo, varCicloAtual),
                                                            DataCriacao: Now(),
                                                            ResponsavelSala: If(
                                                                IsEmpty(varResponsaveisNCDeposito),
                                                                Table(varPessoaLogadaSP),
                                                                varResponsaveisNCDeposito
                                                            ),
                                                            DescricaoNC: ""
                                                        }
                                                    )
                                                )
                                            )
                                        );

                                        If(
                                            !varRodizioValidado,
                                            Set(varBusy, false),

                                            Set(
                                                varStatusGeralDeposito,
                                                If(
                                                    Coalesce(varRegistroChecklist.StatusGeral.Value, "") = "Crítico",
                                                    "Crítico",
                                                    If(
                                                        Coalesce(varRegistroChecklist.StatusGeral.Value, "") = "Atenção" ||
                                                        varTemNC_Deposito1,
                                                        "Atenção",
                                                        "Conforme"
                                                    )
                                                )
                                            );

                                            Set(
                                                varRegistroChecklistAtualizadoDeposito,
                                                IfError(
                                                    Patch(
                                                        Checklist_OrganizacaoPellet2025,
                                                        varRegistroChecklist,
                                                        {
                                                            ChaoLivreDeposito1: {
                                                                Value: DataCardValue90.Selected.Value
                                                            },
                                                            PrateleirasOrgDeposito1: {
                                                                Value: DataCardValue91.Selected.Value
                                                            },
                                                            EtiquetasOkDeposito1: {
                                                                Value: DataCardValue92.Selected.Value
                                                            },
                                                            EquipamentosIdentificacao1: {
                                                                Value: DataCardValue93.Selected.Value
                                                            },
                                                            DescarteDeposito1: {
                                                                Value: DataCardValue94.Selected.Value
                                                            },
                                                            PlataformaDeposito1: {
                                                                Value: DataCardValue95.Selected.Value
                                                            },
                                                            PrateleirasFirmes1: {
                                                                Value: DataCardValue96.Selected.Value
                                                            },
                                                            StatusGeral: {
                                                                Value: varStatusGeralDeposito
                                                            },
                                                            StatusNC: If(
                                                                varTemNC_Deposito1 ||
                                                                Coalesce(varRegistroChecklist.StatusNC.Value, "") = "Pendente",
                                                                {
                                                                    Value: "Pendente"
                                                                },
                                                                {
                                                                    Value: "Concluído"
                                                                }
                                                            )
                                                        }
                                                    ),
                                                    Defaults(Checklist_OrganizacaoPellet2025)
                                                )
                                            );

                                            If(
                                                IsBlank(varRegistroChecklistAtualizadoDeposito.ID),
                                                Notify(
                                                    "❌ Erro ao salvar checklist do Depósito. Verifique conexão ou permissão.",
                                                    NotificationType.Error
                                                );
                                                Set(varBusy, false),

                                                Set(varRegistroChecklist, varRegistroChecklistAtualizadoDeposito);

                                                If(
                                                    varTemNC_Deposito1,
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaNCDeposito,
                                                        ScreenTransition.Fade
                                                    ),
                                                    ResetForm(Form_Deposito1);
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaFinal,
                                                        ScreenTransition.Fade
                                                    )
                                                )
                                            )
                                        )

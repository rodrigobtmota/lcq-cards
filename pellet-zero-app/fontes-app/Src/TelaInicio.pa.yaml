      - HtmlBoasVindas:
          Control: HtmlViewer@2.1.0
          Properties:
            DisabledBorderColor: =RGBA(161, 159, 157, 1)
            Font: =Font.'Segoe UI'
            Height: =101
            HtmlText: |-
              =With(
                  {
                      _nome:
                          Trim(
                              Substitute(
                                  Substitute(
                                      Substitute(
                                          Substitute(
                                              Substitute(
                                                  Substitute(
                                                      " " & Proper(Lower(User().FullName)) & " ",
                                                      " De ", " de "
                                                  ),
                                                  " Da ", " da "
                                              ),
                                              " Do ", " do "
                                          ),
                                          " Dos ", " dos "
                                      ),
                                      " Das ", " das "
                                  ),
                                  " E ", " e "
                              )
                          )
                  },
                  "<div style='
                      width:100%;
                      font-family:Open Sans, Segoe UI, Arial, sans-serif;
                      color:#FFFFFF;
                      line-height:1.45;
                  '>
                      <div style='
                          margin:0 0 6px 0;
                          font-size:24px;
                          font-weight:700;
                      '>
                          Olá, " & _nome & "!
                      </div>

                      <div style='
                          margin:0;
                          font-size:18px;
                          font-weight:600;
                      '>
                          Seja bem-vindo ao Programa de Segurança, Organização Física e Sustentação do Programa Pellet Zero do LCQ-RJ
                      </div>
                  </div>"
              )
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Width: =1063
            X: =267
            Y: =90

              )

            Fill: =RGBA(0, 56, 168, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =119
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(16, 110, 190, 1)
            OnSelect: |-
              =If(
                  varBusy,
                  Blank(),

                  If(
                      IsEmpty(DataCardValue49.SelectedItems) || IsEmpty(DataCardValue33.SelectedItems),

                      Notify(
                          "Selecione Sala e Turno para iniciar.",
                          NotificationType.Warning
                      ),

                      Set(varBusy, true);
                      Set(varErroIniciarChecklist, false);
                      Set(varChecklistSemRodizioAtivo, false);
                      Set(varSalaVaiParaPellet, false);

                      With(
                          {
                              salaChoice: First(DataCardValue49.SelectedItems),
                              turnoChoice: First(DataCardValue33.SelectedItems)
                          },

                          Set(varSalaSelecionada, salaChoice);

                          Set(
                              varPessoaLogadaSP,
                              {
                                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                  Claims: "i:0#.f|membership|" & Lower(Coalesce(varUserEmail, User().Email)),
                                  DisplayName: Coalesce(varUserNome, User().FullName),
                                  Email: Lower(Coalesce(varUserEmail, User().Email)),
                                  Department: "",
                                  JobTitle: "",
                                  Picture: ""
                              }
                          );

                          Set(
                              varSalaVaiParaPellet,
                              Or(
                                  salaChoice.Value = "Sala de Físico-Químico 3",
                                  salaChoice.Value = "Sala de Físico-Químico 4",
                                  salaChoice.Value = "Sala de Processamento de Resinas",
                                  salaChoice.Value = "Sala de Reserva Técnica"
                              )
                          );

                          ClearCollect(
                              colRodizioAtivoSala,
                              Filter(
                                  RodizioPlanejado,
                                  Sala.Value = salaChoice.Value &&
                                  StatusRodizio.Value = "Ativo" &&
                                  Publicado = true &&
                                  InicioRodizio <= Today() &&
                                  FimRodizio >= Today()
                              )
                          );

                          If(
                              CountRows(colRodizioAtivoSala) > 1,

                              Notify(
                                  "❌ Existe mais de um rodízio ativo publicado para esta sala. Corrija a lista RodizioPlanejado antes de iniciar o checklist.",
                                  NotificationType.Error
                              );
                              Set(varBusy, false),

                              If(
                                  CountRows(colRodizioAtivoSala) = 0,

                                  Set(varChecklistSemRodizioAtivo, true);

                                  Set(
                                      varCicloAtual,
                                      Switch(
                                          true,
                                          Month(Today()) <= 4, "C1-" & Text(Year(Today())),
                                          Month(Today()) <= 8, "C2-" & Text(Year(Today())),
                                          "C3-" & Text(Year(Today()))
                                      )
                                  );

                                  Set(
                                      varRodizioSalaAtual,
                                      {
                                          Sala: salaChoice,
                                          Ciclo: varCicloAtual,
                                          ResponsavelSala: Table(varPessoaLogadaSP)
                                      }
                                  );

                                  Notify(
                                      "⚠️ Nenhum rodízio ativo publicado foi encontrado para esta sala. O checklist será iniciado em modo contingência no ciclo " & varCicloAtual & ".",
                                      NotificationType.Warning
                                  ),

                                  Set(varChecklistSemRodizioAtivo, false);

                                  Set(
                                      varRodizioSalaAtual,
                                      First(colRodizioAtivoSala)
                                  );

                                  Set(
                                      varCicloAtual,
                                      Coalesce(
                                          Text(varRodizioSalaAtual.Ciclo),
                                          ""
                                      )
                                  )
                              );

                              If(
                                  IsBlank(varCicloAtual),

                                  Notify(
                                      "❌ Não foi possível definir o ciclo atual. Corrija o RodizioPlanejado ou a regra de ciclo antes de iniciar.",
                                      NotificationType.Error
                                  );
                                  Set(varBusy, false),

                                  IfError(
                                      Set(
                                          varRegistroChecklist,
                                          Patch(
                                              Checklist_OrganizacaoPellet2025,
                                              Defaults(Checklist_OrganizacaoPellet2025),
                                              {
                                                  Título:
                                                      If(
                                                          varChecklistSemRodizioAtivo,
                                                          "Checklist CONTINGÊNCIA - ",
                                                          "Checklist - "
                                                      ) &
                                                      salaChoice.Value &
                                                      " - " &
                                                      Text(Now(), "[$-pt-BR]dd/mm/yyyy HH:mm"),

                                                  ResponsavelInspecao: varPessoaLogadaSP,

                                                  Sala: salaChoice,
                                                  Turno: turnoChoice,
                                                  DataInspecao: Now(),
                                                  Ciclo: varCicloAtual,

                                                  TipoVerificacao: If(
                                                      turnoChoice.Value = "Equipe ADM",
                                                      {Value: "Checklist Quinzenal - Equipe Administrativa"},
                                                      {Value: "Checklist Semanal - Equipe de Turno"}
                                                  ),

                                                  StatusNC: {Value: "Pendente"},
                                                  StatusGeral: {Value: "Conforme"}
                                              }
                                          )
                                      ),

                                      Set(varErroIniciarChecklist, true);
                                      Notify(
                                          "❌ Falha ao iniciar o checklist. Verifique permissão, conexão ou campos obrigatórios.",
                                          NotificationType.Error
                                      )
                                  );

                                  If(
                                      varErroIniciarChecklist,

                                      Set(varBusy, false),

                                      Notify(
                                          If(
                                              varChecklistSemRodizioAtivo,
                                              "⚠️ Checklist iniciado em modo contingência. Ciclo: " & varCicloAtual,
                                              "✅ Checklist iniciado com sucesso! Ciclo: " & varCicloAtual
                                          ),
                                          If(
                                              varChecklistSemRodizioAtivo,
                                              NotificationType.Warning,
                                              NotificationType.Success
                                          )
                                      );

                                      Concurrent(
                                          ResetForm(Form_telaOrganizacao),
                                          ResetForm(Form_telaFinal),
                                          ResetForm(Form_Telapellet),
                                          ResetForm(Form_Reserva),
                                          ResetForm(Form_Oficina),
                                          ResetForm(Form_Shelter),
                                          ResetForm(Form_Deposito1),
                                          ResetForm(Form_Lavagem),
                                          ResetForm(Form_Almoxarifado)
                                      );

                                      Concurrent(
                                          Clear(colNCtemporarias),
                                          Set(varTemNC_Organizacao, false),
                                          Set(varTemNC_Pellet, false),
                                          Set(varTemNC_ReservaTecnica, false),
                                          Set(varTemNC_OficinaAOL, false),
                                          Set(varTemNC_Almoxarifado, false),
                                          Set(varTemNC_Lavagem, false),
                                          Set(varTemNC_Shelter, false),
                                          Set(varTemNC_Deposito1, false)
                                      );

                                      Set(varBusy, false);

                                      If(
                                          StartsWith(varSalaSelecionada.Value, "Shelter"),

                                          Navigate(
                                              TelaShelter,
                                              ScreenTransition.Fade
                                          ),

                                          Switch(
                                              varSalaSelecionada.Value,

                                              "Sala de Reserva Técnica",
                                              Navigate(
                                                  TelaReservaTecnica,
                                                  ScreenTransition.Fade
                                              ),

                                              "Oficina de Manutenção AOL",
                                              Navigate(
                                                  TelaOficinaAOL,
                                                  ScreenTransition.Fade
                                              ),

                                              "Depósito 01 AOL",
                                              Navigate(
                                                  TelaDeposito,
                                                  ScreenTransition.Fade
                                              ),

                                              "Depósito 02 AOL/Q4",
                                              Navigate(
                                                  TelaDeposito,
                                                  ScreenTransition.Fade
                                              ),

                                              "Sala de Físico-Químico 1",
                                              Navigate(
                                                  TelaOrganizacao,
                                                  ScreenTransition.Fade
                                              ),

                                              "Sala de Físico-Químico 2",
                                              Navigate(
                                                  TelaOrganizacao,
                                                  ScreenTransition.Fade
                                              ),

                                              "Sala de Físico-Químico 3",
                                              Navigate(
                                                  TelaOrganizacao,
                                                  ScreenTransition.Fade
                                              ),

                                              "Sala de Físico-Químico 4",
                                              Navigate(
                                                  TelaOrganizacao,
                                                  ScreenTransition.Fade
                                              ),

                                              "Sala de Cromatografia 1",
                                              Navigate(
                                                  TelaOrganizacao,
                                                  ScreenTransition.Fade
                                              ),

                                              "Sala de Cromatografia 2",
                                              Navigate(
                                                  TelaOrganizacao,
                                                  ScreenTransition.Fade
                                              ),

                                              "Sala de Processamento de Resinas",
                                              Navigate(
                                                  TelaOrganizacao,
                                                  ScreenTransition.Fade
                                              ),

                                              "Sala de Lavagem",
                                              Navigate(
                                                  TelaLavagem,
                                                  ScreenTransition.Fade
                                              ),

                                              "Almoxarifado",
                                              Navigate(
                                                  TelaAlmoxarifado,
                                                  ScreenTransition.Fade
                                              ),

                                              Notify(
                                                  "⚠️ Sala não mapeada para navegação: " & varSalaSelecionada.Value,
                                                  NotificationType.Warning
                                              );
                                              Navigate(
                                                  TelaOrganizacao,
                                                  ScreenTransition.Fade
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                      )
                  )
              )
            PaddingBottom: =30
            PaddingLeft: =110
            PressedBorderColor: =RGBA(0, 69, 120, 1)

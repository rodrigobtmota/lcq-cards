Screens:
  scrIndicadoresPrograma:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =If(
            varBusyIndicadores,

            Notify(
                "⏳ Aguarde, os indicadores já estão sendo atualizados.",
                NotificationType.Information
            ),

            If(
                !IsBlank(dtIniFiltroInd.SelectedDate) &&
                !IsBlank(dtFimFiltroInd.SelectedDate) &&
                dtIniFiltroInd.SelectedDate > dtFimFiltroInd.SelectedDate,

                Notify(
                    "❌ A data inicial não pode ser maior que a data final.",
                    NotificationType.Error
                ),

                Set(varBusyIndicadores, true);

                IfError(
                    Refresh(Checklist_OrganizacaoPellet2025);
                    Refresh(NaoConformidadesPorSala);

                    Set(
                        varSalaFiltroIndAtual,
                        If(
                            IsBlank(ddSalaFiltroInd.Selected.Value),
                            "TODAS",
                            ddSalaFiltroInd.Selected.Value
                        )
                    );

                    Clear(colSalas);

                    Collect(
                        colSalas,
                        {Value: "TODAS"}
                    );

                    IfError(
                        Collect(
                            colSalas,
                            SortByColumns(
                                Filter(
                                    Choices([@Checklist_OrganizacaoPellet2025].Sala),
                                    !IsBlank(Value)
                                ),
                                "Value",
                                SortOrder.Ascending
                            )
                        ),

                        Notify(
                            "⚠️ Não foi possível carregar as salas da lista Checklist_OrganizacaoPellet2025.",
                            NotificationType.Warning
                        )
                    );

                    Set(
                        varDataInicioInd,
                        If(
                            IsBlank(dtIniFiltroInd.SelectedDate),
                            Date(
                                Year(Today()),
                                1,
                                1
                            ),
                            dtIniFiltroInd.SelectedDate
                        )
                    );

                    Set(
                        varDataFimInd,
                        If(
                            IsBlank(dtFimFiltroInd.SelectedDate),
                            Today(),
                            dtFimFiltroInd.SelectedDate
                        )
                    );

                    Set(varPercChecklistsConformes, Blank());
                    Set(varPercSalasConformes, Blank());
                    Set(varAderenciaChecklist, Blank());
                    Set(varAderenciaChecklistAdm, Blank());
                    Set(varTempoMedioTratamentoNC, Blank());
                    Set(varConformidadeSustentada, Blank());

                    Set(varTotalChecklists, 0);
                    Set(varChecklistsConformes, 0);
                    Set(varChecklistsNaoConformes, 0);

                    Set(varTotalSalasEscopo, 0);
                    Set(varSalasConformes, 0);
                    Set(varSemInspecaoEscopo, false);

                    Set(varPrevistoChecklist, 0);
                    Set(varExecutadoChecklist, 0);

                    Set(varPrevistoChecklistAdm, 0);
                    Set(varExecutadoChecklistAdm, 0);

                    Set(varTotalNCsPeriodo, 0);
                    Set(varNCsEncerradasPeriodo, 0);
                    Set(varNCsNaoEncerradasPeriodo, 0);
                    Set(varNCsVencidas, 0);
                    Set(varNCsCriticasPeriodo, 0);
                    Set(varSalasComReincidencia, 0);

                    Set(varDiasPeriodoIndicador, 0);
                    Set(varSemanasPeriodoIndicador, 0);
                    Set(varDiasPeriodoAdm, 0);
                    Set(varQuinzenasPeriodoAdm, 0);

                    Set(varQtdSalasAdministrativas, 6);
                    Set(varMetaAderenciaAdm, 90);
                    Set(varPeriodicidadeAdmDias, 15);

                    Set(
                        varDiasPeriodoIndicador,
                        DateDiff(
                            varDataInicioInd,
                            DateAdd(
                                varDataFimInd,
                                1,
                                TimeUnit.Days
                            ),
                            TimeUnit.Days
                        )
                    );

                    Set(
                        varSemanasPeriodoIndicador,
                        Max(
                            1,
                            RoundUp(
                                varDiasPeriodoIndicador / 7,
                                0
                            )
                        )
                    );

                    Set(
                        varPrevistoChecklist,
                        varSemanasPeriodoIndicador * 3
                    );

                    Set(
                        varDiasPeriodoAdm,
                        DateDiff(
                            varDataInicioInd,
                            DateAdd(
                                varDataFimInd,
                                1,
                                TimeUnit.Days
                            ),
                            TimeUnit.Days
                        )
                    );

                    Set(
                        varQuinzenasPeriodoAdm,
                        Max(
                            1,
                            RoundUp(
                                varDiasPeriodoAdm / varPeriodicidadeAdmDias,
                                0
                            )
                        )
                    );

                    Set(
                        varPrevistoChecklistAdm,
                        If(
                            varSalaFiltroIndAtual = "TODAS",
                            varQtdSalasAdministrativas * varQuinzenasPeriodoAdm,
                            varQuinzenasPeriodoAdm
                        )
                    );

                    Set(
                        varNCsVencidas,
                        CountRows(
                            Filter(
                                colNCIndicadoresBase,
                                StatusNCTexto <> "Encerrada" &&
                                StatusNCTexto <> "Cancelada" &&
                                !IsBlank(DataLimiteCorrecao) &&
                                DataLimiteCorrecao < Today()
                            )
                        )
                    );

                    Set(
                        varNCsCriticasPeriodo,
                        CountRows(
                            Filter(
                                colNCIndicadoresBase,
                                ClassificacaoNC.Value = "Crítica / Segurança"
                            )
                        )
                    );

                    Clear(colNCReincidencia);

                    ForAll(
                        Filter(
                            colNCIndicadoresBase,
                            !IsBlank(SalaTexto) &&
                            !IsBlank(ItemChecklistOrigem)
                        ) As NcRow,
                        Collect(
                            colNCReincidencia,
                            {
                                Sala: NcRow.SalaTexto,
                                Chave: NcRow.SalaTexto & "|" & NcRow.ItemChecklistOrigem
                            }
                        )
                    );

                    Set(
                        varSalasComReincidencia,
                        CountRows(
                            Distinct(
                                Filter(
                                    colNCReincidencia As RowRe,
                                    CountIf(
                                        colNCReincidencia,
                                        Chave = RowRe.Chave
                                    ) > 1 &&
                                    !IsBlank(
                                        LookUp(
                                            colUltimoChecklistSala,
                                            Sala = RowRe.Sala
                                        )
                                    )
                                ),
                                Sala
                            )
                        )
                    );

                    Set(
                        varConformidadeSustentada,
                        If(
                            varTotalSalasEscopo = 0,
                            Blank(),
                            Round(
                                (varTotalSalasEscopo - varSalasComReincidencia) / varTotalSalasEscopo * 100,
                                0
                            )
                        )
                    );

                    ClearCollect(
                        colChecklistIndicadoresBase,
                        AddColumns(
                            Filter(
                                Checklist_OrganizacaoPellet2025,
                                (
                                    varSalaFiltroIndAtual = "TODAS" ||
                                    Sala.Value = varSalaFiltroIndAtual
                                ) &&
                                (
                                    IsBlank(varDataInicioInd) ||
                                    DataInspecao >= varDataInicioInd
                                ) &&
                                (
                                    IsBlank(varDataFimInd) ||
                                    DataInspecao < DateAdd(
                                        varDataFimInd,
                                        1,
                                        TimeUnit.Days
                                    )
                                )
                            ),
                            SalaTexto,
                            Sala.Value,
                            TurnoTexto,
                            Turno.Value,
                            StatusGeralTexto,
                            StatusGeral.Value,
                            StatusNCTexto,
                            StatusNC.Value
                        )
                    );

                    ClearCollect(
                        colChecklistTurnoGeral,
                        AddColumns(
                            Filter(
                                Checklist_OrganizacaoPellet2025,
                                (
                                    IsBlank(varDataInicioInd) ||
                                    DataInspecao >= varDataInicioInd
                                ) &&
                                (
                                    IsBlank(varDataFimInd) ||
                                    DataInspecao < DateAdd(
                                        varDataFimInd,
                                        1,
                                        TimeUnit.Days
                                    )
                                ) &&
                                (
                                    Turno.Value = "Turno A" ||
                                    Turno.Value = "Turno B" ||
                                    Turno.Value = "Turno C" ||
                                    Turno.Value = "Turno D" ||
                                    Turno.Value = "Turno E"
                                )
                            ),
                            SalaTexto,
                            Sala.Value,
                            TurnoTexto,
                            Turno.Value,
                            StatusGeralTexto,
                            StatusGeral.Value,
                            StatusNCTexto,
                            StatusNC.Value
                        )
                    );

                    ClearCollect(
                        colChecklistAdministrativo,
                        AddColumns(
                            Filter(
                                Checklist_OrganizacaoPellet2025,
                                (
                                    varSalaFiltroIndAtual = "TODAS" ||
                                    Sala.Value = varSalaFiltroIndAtual
                                ) &&
                                (
                                    IsBlank(varDataInicioInd) ||
                                    DataInspecao >= varDataInicioInd
                                ) &&
                                (
                                    IsBlank(varDataFimInd) ||
                                    DataInspecao < DateAdd(
                                        varDataFimInd,
                                        1,
                                        TimeUnit.Days
                                    )
                                ) &&
                                Turno.Value = "Equipe ADM"
                            ),
                            SalaTexto,
                            Sala.Value,
                            TurnoTexto,
                            Turno.Value,
                            StatusGeralTexto,
                            StatusGeral.Value,
                            StatusNCTexto,
                            StatusNC.Value,
                            QuinzenaAdm,
                            Max(
                                1,
                                RoundUp(
                                    DateDiff(
                                        varDataInicioInd,
                                        DataInspecao,
                                        TimeUnit.Days
                                    ) / varPeriodicidadeAdmDias,
                                    0
                                )
                            )
                        )
                    );

                    ClearCollect(
                        colNCIndicadoresBase,
                        AddColumns(
                            Filter(
                                NaoConformidadesPorSala,
                                (
                                    varSalaFiltroIndAtual = "TODAS" ||
                                    SalaNC.Value = varSalaFiltroIndAtual
                                ) &&
                                (
                                    IsBlank(varDataInicioInd) ||
                                    'DataCriacao ' >= varDataInicioInd
                                ) &&
                                (
                                    IsBlank(varDataFimInd) ||
                                    'DataCriacao ' < DateAdd(
                                        varDataFimInd,
                                        1,
                                        TimeUnit.Days
                                    )
                                )
                            ),
                            SalaTexto,
                            SalaNC.Value,
                            StatusNCTexto,
                            StatusNC.Value,
                            DiasTratamento,
                            If(
                                !IsBlank('DataCriacao ') &&
                                !IsBlank(DataFinalCorretiva),
                                DateDiff(
                                    'DataCriacao ',
                                    DataFinalCorretiva,
                                    TimeUnit.Days
                                ),
                                Blank()
                            )
                        )
                    );

                    Set(
                        varTotalChecklists,
                        CountRows(colChecklistIndicadoresBase)
                    );

                    Set(
                        varChecklistsConformes,
                        CountRows(
                            Filter(
                                colChecklistIndicadoresBase,
                                StatusGeralTexto = "Conforme"
                            )
                        )
                    );

                    Set(
                        varChecklistsNaoConformes,
                        Max(
                            0,
                            varTotalChecklists - varChecklistsConformes
                        )
                    );

                    Set(
                        varPercChecklistsConformes,
                        If(
                            varTotalChecklists = 0,
                            Blank(),
                            Round(
                                varChecklistsConformes / varTotalChecklists * 100,
                                0
                            )
                        )
                    );

                    Clear(colUltimoChecklistSala);

                    ForAll(
                        Sort(
                            Filter(
                                colChecklistIndicadoresBase,
                                !IsBlank(SalaTexto) &&
                                !IsBlank(StatusGeralTexto)
                            ),
                            DataInspecao,
                            SortOrder.Descending
                        ) As CkRow,

                        If(
                            IsEmpty(
                                Filter(
                                    colUltimoChecklistSala,
                                    Sala = CkRow.SalaTexto
                                )
                            ),

                            Collect(
                                colUltimoChecklistSala,
                                {
                                    Sala: CkRow.SalaTexto,
                                    UltimoStatusGeral: CkRow.StatusGeralTexto
                                }
                            )
                        )
                    );

                    Set(
                        varTotalSalasEscopo,
                        CountRows(colUltimoChecklistSala)
                    );

                    Set(
                        varSemInspecaoEscopo,
                        varTotalSalasEscopo = 0
                    );

                    Set(
                        varSalasConformes,
                        CountRows(
                            Filter(
                                colUltimoChecklistSala,
                                UltimoStatusGeral = "Conforme"
                            )
                        )
                    );

                    Set(
                        varPercSalasConformes,
                        If(
                            varTotalSalasEscopo = 0,
                            Blank(),
                            Round(
                                varSalasConformes / varTotalSalasEscopo * 100,
                                0
                            )
                        )
                    );

                    Set(
                        varExecutadoChecklist,
                        CountRows(colChecklistTurnoGeral)
                    );

                    Set(
                        varAderenciaChecklist,
                        If(
                            varPrevistoChecklist = 0,
                            Blank(),
                            Round(
                                Min(
                                    100,
                                    varExecutadoChecklist / varPrevistoChecklist * 100
                                ),
                                0
                            )
                        )
                    );

                    Clear(colChecklistAdmUnico);

                    ForAll(
                        colChecklistAdministrativo As CkAdm,

                        If(
                            !IsBlank(CkAdm.SalaTexto) &&
                            IsEmpty(
                                Filter(
                                    colChecklistAdmUnico,
                                    ChaveAdm = CkAdm.SalaTexto & "_" & Text(CkAdm.QuinzenaAdm)
                                )
                            ),

                            Collect(
                                colChecklistAdmUnico,
                                {
                                    Sala: CkAdm.SalaTexto,
                                    Quinzena: CkAdm.QuinzenaAdm,
                                    ChaveAdm: CkAdm.SalaTexto & "_" & Text(CkAdm.QuinzenaAdm),
                                    StatusGeral: CkAdm.StatusGeralTexto
                                }
                            )
                        )
                    );

                    Set(
                        varExecutadoChecklistAdm,
                        CountRows(colChecklistAdmUnico)
                    );

                    Set(
                        varAderenciaChecklistAdm,
                        If(
                            varPrevistoChecklistAdm = 0,
                            Blank(),
                            Round(
                                Min(
                                    100,
                                    varExecutadoChecklistAdm / varPrevistoChecklistAdm * 100
                                ),
                                0
                            )
                        )
                    );

                    Set(
                        varTotalNCsPeriodo,
                        CountRows(colNCIndicadoresBase)
                    );

                    Set(
                        varNCsEncerradasPeriodo,
                        CountRows(
                            Filter(
                                colNCIndicadoresBase,
                                StatusNCTexto = "Encerrada" &&
                                !IsBlank(DiasTratamento)
                            )
                        )
                    );

                    Set(
                        varNCsNaoEncerradasPeriodo,
                        Max(
                            0,
                            varTotalNCsPeriodo - varNCsEncerradasPeriodo
                        )
                    );

                    Set(
                        varTempoMedioTratamentoNC,
                        If(
                            varTotalNCsPeriodo = 0,
                            Blank(),
                            If(
                                varNCsEncerradasPeriodo = 0,
                                Blank(),
                                Round(
                                    Average(
                                        Filter(
                                            colNCIndicadoresBase,
                                            StatusNCTexto = "Encerrada" &&
                                            !IsBlank(DiasTratamento)
                                        ),
                                        DiasTratamento
                                    ),
                                    1
                                )
                            )
                        )
                    );

                    ClearCollect(
                        colGraficoConformidade,
                        {
                            Categoria: "Conformes",
                            Valor: varChecklistsConformes,
                            RotuloLegenda: "Conformes " &
                                If(
                                    varTotalChecklists = 0,
                                    "0%",
                                    Text(
                                        Round(
                                            varChecklistsConformes / varTotalChecklists * 100,
                                            0
                                        ),
                                        "[$-pt-BR]0"
                                    ) & "%"
                                ) &
                                " (" &
                                Text(
                                    varChecklistsConformes,
                                    "[$-pt-BR]0"
                                ) &
                                ")"
                        },
                        {
                            Categoria: "Não conformes",
                            Valor: varChecklistsNaoConformes,
                            RotuloLegenda: "Não conformes " &
                                If(
                                    varTotalChecklists = 0,
                                    "0%",
                                    Text(
                                        Round(
                                            varChecklistsNaoConformes / varTotalChecklists * 100,
                                            0
                                        ),
                                        "[$-pt-BR]0"
                                    ) & "%"
                                ) &
                                " (" &
                                Text(
                                    varChecklistsNaoConformes,
                                    "[$-pt-BR]0"
                                ) &
                                ")"
                        }
                    );

                    Set(varBusyIndicadores, false);

                    Notify(
                        "✅ Indicadores atualizados com sucesso.",
                        NotificationType.Success
                    ),

                    Set(varBusyIndicadores, false);

                    Notify(
                        "❌ Erro ao atualizar indicadores. Verifique os campos 'DataCriacao ', StatusNC, SalaNC ou a conexão das listas.",
                        NotificationType.Error
                    )
                )
            )
        )
    Children:
      - Container12:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =Color.White
            Height: =514
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Width: =549
            X: =761
            Y: =205
      - lblSubtituloRelatorioFlex_1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            Color: =RGBA(0,56,168,1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            FocusedBorderThickness: =4
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Text: |-
              =If(
                  IsBlank(varDataInicioInd) || IsBlank(varDataFimInd),
                  " Selecione sala e período para consultar os indicadores do programa.",
                  " Período analisado: " &
                  Text(varDataInicioInd, "[$-pt-BR]dd/mm/yyyy") &
                  " a " &
                  Text(varDataFimInd, "[$-pt-BR]dd/mm/yyyy") &
                  " | Sala: " &
                  Coalesce(varSalaFiltroIndAtual, "TODAS")
              )
            Width: =1280
            X: =40
            Y: =78
      - cardFiltros_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255,255,255,1)
            Height: =73
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =1271
            X: =48
            Y: =118
      - dtIniFiltroInd:
          Control: Classic/DatePicker@2.6.0
          Properties:
            AccessibleLabel: ="Data inicial do período dos indicadores"
            BorderColor: =RGBA(218,225,235,1)
            Color: =RGBA(45,55,72,1)
            DefaultDate: |-
              =Date(
                  Year(Today()),
                  1,
                  1
              )
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(250,251,253,1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =48
            IconBackground: =RGBA(0,56,168,1)
            IconFill: =Color.White
            PaddingTop: =5
            Size: =15
            Width: =220
            X: =450
            Y: |+
              =127
      - dtFimFiltroInd:
          Control: Classic/DatePicker@2.6.0
          Properties:
            AccessibleLabel: ="Data final do período dos indicadores"
            BorderColor: =RGBA(218,225,235,1)
            Color: =RGBA(45,55,72,1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: =RGBA(250,251,253,1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =48
            IconBackground: =RGBA(0,56,168,1)
            IconFill: =Color.White
            PaddingTop: =5
            Size: =15
            Width: =220
            X: =700
            Y: |+
              =127
      - btnAtualizarIndicadores:
          Control: Classic/Button@2.2.0
          Properties:
            AccessibleLabel: ="Buscar e atualizar indicadores"
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =Color.White
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            DisplayMode: |-
              =If(
                  varBusyIndicadores,
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =RGBA(3, 52, 162, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =48
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0,95,180,1)
            OnSelect: |-
              =If(
                  varBusyIndicadores,

                  Notify(
                      "⏳ Aguarde, os indicadores já estão sendo atualizados.",
                      NotificationType.Information
                  ),

                  If(
                      !IsBlank(dtIniFiltroInd.SelectedDate) &&
                      !IsBlank(dtFimFiltroInd.SelectedDate) &&
                      dtIniFiltroInd.SelectedDate > dtFimFiltroInd.SelectedDate,

                      Notify(
                          "❌ A data inicial não pode ser maior que a data final.",
                          NotificationType.Error
                      ),

                      Set(varBusyIndicadores, true);

                      IfError(
                          Refresh(Checklist_OrganizacaoPellet2025);
                          Refresh(NaoConformidadesPorSala);

                          Set(
                              varSalaFiltroIndAtual,
                              If(
                                  IsBlank(ddSalaFiltroInd.Selected.Value),
                                  "TODAS",
                                  ddSalaFiltroInd.Selected.Value
                              )
                          );

                          Clear(colSalas);

                          Collect(
                              colSalas,
                              {Value: "TODAS"}
                          );

                          IfError(
                              Collect(
                                  colSalas,
                                  SortByColumns(
                                      Filter(
                                          Choices([@Checklist_OrganizacaoPellet2025].Sala),
                                          !IsBlank(Value)
                                      ),
                                      "Value",
                                      SortOrder.Ascending
                                  )
                              ),

                              Notify(
                                  "⚠️ Não foi possível carregar as salas da lista Checklist_OrganizacaoPellet2025.",
                                  NotificationType.Warning
                              )
                          );

                          Set(
                              varDataInicioInd,
                              If(
                                  IsBlank(dtIniFiltroInd.SelectedDate),
                                  Date(
                                      Year(Today()),
                                      1,
                                      1
                                  ),
                                  dtIniFiltroInd.SelectedDate
                              )
                          );

                          Set(
                              varDataFimInd,
                              If(
                                  IsBlank(dtFimFiltroInd.SelectedDate),
                                  Today(),
                                  dtFimFiltroInd.SelectedDate
                              )
                          );

                          Set(varPercChecklistsConformes, Blank());
                          Set(varPercSalasConformes, Blank());
                          Set(varAderenciaChecklist, Blank());
                          Set(varAderenciaChecklistAdm, Blank());
                          Set(varTempoMedioTratamentoNC, Blank());
                          Set(varConformidadeSustentada, Blank());

                          Set(varTotalChecklists, 0);
                          Set(varChecklistsConformes, 0);
                          Set(varChecklistsNaoConformes, 0);

                          Set(varTotalSalasEscopo, 0);
                          Set(varSalasConformes, 0);
                          Set(varSemInspecaoEscopo, false);

                          Set(varPrevistoChecklist, 0);
                          Set(varExecutadoChecklist, 0);

                          Set(varPrevistoChecklistAdm, 0);
                          Set(varExecutadoChecklistAdm, 0);

                          Set(varTotalNCsPeriodo, 0);
                          Set(varNCsEncerradasPeriodo, 0);
                          Set(varNCsNaoEncerradasPeriodo, 0);
                          Set(varNCsVencidas, 0);
                          Set(varNCsCriticasPeriodo, 0);
                          Set(varSalasComReincidencia, 0);

                          Set(varDiasPeriodoIndicador, 0);
                          Set(varSemanasPeriodoIndicador, 0);
                          Set(varDiasPeriodoAdm, 0);
                          Set(varQuinzenasPeriodoAdm, 0);

                          Set(varQtdSalasAdministrativas, 6);
                          Set(varMetaAderenciaAdm, 90);
                          Set(varPeriodicidadeAdmDias, 15);

                          Set(
                              varDiasPeriodoIndicador,
                              DateDiff(
                                  varDataInicioInd,
                                  DateAdd(
                                      varDataFimInd,
                                      1,
                                      TimeUnit.Days
                                  ),
                                  TimeUnit.Days
                              )
                          );

                          Set(
                              varSemanasPeriodoIndicador,
                              Max(
                                  1,
                                  RoundUp(
                                      varDiasPeriodoIndicador / 7,
                                      0
                                  )
                              )
                          );

                          Set(
                              varPrevistoChecklist,
                              varSemanasPeriodoIndicador * 3
                          );

                          Set(
                              varDiasPeriodoAdm,
                              DateDiff(
                                  varDataInicioInd,
                                  DateAdd(
                                      varDataFimInd,
                                      1,
                                      TimeUnit.Days
                                  ),
                                  TimeUnit.Days
                              )
                          );

                          Set(
                              varQuinzenasPeriodoAdm,
                              Max(
                                  1,
                                  RoundUp(
                                      varDiasPeriodoAdm / varPeriodicidadeAdmDias,
                                      0
                                  )
                              )
                          );

                          Set(
                              varPrevistoChecklistAdm,
                              If(
                                  varSalaFiltroIndAtual = "TODAS",
                                  varQtdSalasAdministrativas * varQuinzenasPeriodoAdm,
                                  varQuinzenasPeriodoAdm
                              )
                          );

                          Set(
                              varNCsVencidas,
                              CountRows(
                                  Filter(
                                      colNCIndicadoresBase,
                                      StatusNCTexto <> "Encerrada" &&
                                      StatusNCTexto <> "Cancelada" &&
                                      !IsBlank(DataLimiteCorrecao) &&
                                      DataLimiteCorrecao < Today()
                                  )
                              )
                          );

                          Set(
                              varNCsCriticasPeriodo,
                              CountRows(
                                  Filter(
                                      colNCIndicadoresBase,
                                      ClassificacaoNC.Value = "Crítica / Segurança"
                                  )
                              )
                          );

                          Clear(colNCReincidencia);

                          ForAll(
                              Filter(
                                  colNCIndicadoresBase,
                                  !IsBlank(SalaTexto) &&
                                  !IsBlank(ItemChecklistOrigem)
                              ) As NcRow,
                              Collect(
                                  colNCReincidencia,
                                  {
                                      Sala: NcRow.SalaTexto,
                                      Chave: NcRow.SalaTexto & "|" & NcRow.ItemChecklistOrigem
                                  }
                              )
                          );

                          Set(
                              varSalasComReincidencia,
                              CountRows(
                                  Distinct(
                                      Filter(
                                          colNCReincidencia As RowRe,
                                          CountIf(
                                              colNCReincidencia,
                                              Chave = RowRe.Chave
                                          ) > 1 &&
                                          !IsBlank(
                                              LookUp(
                                                  colUltimoChecklistSala,
                                                  Sala = RowRe.Sala
                                              )
                                          )
                                      ),
                                      Sala
                                  )
                              )
                          );

                          Set(
                              varConformidadeSustentada,
                              If(
                                  varTotalSalasEscopo = 0,
                                  Blank(),
                                  Round(
                                      (varTotalSalasEscopo - varSalasComReincidencia) / varTotalSalasEscopo * 100,
                                      0
                                  )
                              )
                          );

                          ClearCollect(
                              colChecklistIndicadoresBase,
                              AddColumns(
                                  Filter(
                                      Checklist_OrganizacaoPellet2025,
                                      (
                                          varSalaFiltroIndAtual = "TODAS" ||
                                          Sala.Value = varSalaFiltroIndAtual
                                      ) &&
                                      (
                                          IsBlank(varDataInicioInd) ||
                                          DataInspecao >= varDataInicioInd
                                      ) &&
                                      (
                                          IsBlank(varDataFimInd) ||
                                          DataInspecao < DateAdd(
                                              varDataFimInd,
                                              1,
                                              TimeUnit.Days
                                          )
                                      )
                                  ),
                                  SalaTexto,
                                  Sala.Value,
                                  TurnoTexto,
                                  Turno.Value,
                                  StatusGeralTexto,
                                  StatusGeral.Value,
                                  StatusNCTexto,
                                  StatusNC.Value
                              )
                          );

                          ClearCollect(
                              colChecklistTurnoGeral,
                              AddColumns(
                                  Filter(
                                      Checklist_OrganizacaoPellet2025,
                                      (
                                          IsBlank(varDataInicioInd) ||
                                          DataInspecao >= varDataInicioInd
                                      ) &&
                                      (
                                          IsBlank(varDataFimInd) ||
                                          DataInspecao < DateAdd(
                                              varDataFimInd,
                                              1,
                                              TimeUnit.Days
                                          )
                                      ) &&
                                      (
                                          Turno.Value = "Turno A" ||
                                          Turno.Value = "Turno B" ||
                                          Turno.Value = "Turno C" ||
                                          Turno.Value = "Turno D" ||
                                          Turno.Value = "Turno E"
                                      )
                                  ),
                                  SalaTexto,
                                  Sala.Value,
                                  TurnoTexto,
                                  Turno.Value,
                                  StatusGeralTexto,
                                  StatusGeral.Value,
                                  StatusNCTexto,
                                  StatusNC.Value
                              )
                          );

                          ClearCollect(
                              colChecklistAdministrativo,
                              AddColumns(
                                  Filter(
                                      Checklist_OrganizacaoPellet2025,
                                      (
                                          varSalaFiltroIndAtual = "TODAS" ||
                                          Sala.Value = varSalaFiltroIndAtual
                                      ) &&
                                      (
                                          IsBlank(varDataInicioInd) ||
                                          DataInspecao >= varDataInicioInd
                                      ) &&
                                      (
                                          IsBlank(varDataFimInd) ||
                                          DataInspecao < DateAdd(
                                              varDataFimInd,
                                              1,
                                              TimeUnit.Days
                                          )
                                      ) &&
                                      Turno.Value = "Equipe ADM"
                                  ),
                                  SalaTexto,
                                  Sala.Value,
                                  TurnoTexto,
                                  Turno.Value,
                                  StatusGeralTexto,
                                  StatusGeral.Value,
                                  StatusNCTexto,
                                  StatusNC.Value,
                                  QuinzenaAdm,
                                  Max(
                                      1,
                                      RoundUp(
                                          DateDiff(
                                              varDataInicioInd,
                                              DataInspecao,
                                              TimeUnit.Days
                                          ) / varPeriodicidadeAdmDias,
                                          0
                                      )
                                  )
                              )
                          );

                          ClearCollect(
                              colNCIndicadoresBase,
                              AddColumns(
                                  Filter(
                                      NaoConformidadesPorSala,
                                      (
                                          varSalaFiltroIndAtual = "TODAS" ||
                                          SalaNC.Value = varSalaFiltroIndAtual
                                      ) &&
                                      (
                                          IsBlank(varDataInicioInd) ||
                                          'DataCriacao ' >= varDataInicioInd
                                      ) &&
                                      (
                                          IsBlank(varDataFimInd) ||
                                          'DataCriacao ' < DateAdd(
                                              varDataFimInd,
                                              1,
                                              TimeUnit.Days
                                          )
                                      )
                                  ),
                                  SalaTexto,
                                  SalaNC.Value,
                                  StatusNCTexto,
                                  StatusNC.Value,
                                  DiasTratamento,
                                  If(
                                      !IsBlank('DataCriacao ') &&
                                      !IsBlank(DataFinalCorretiva),
                                      DateDiff(
                                          'DataCriacao ',
                                          DataFinalCorretiva,
                                          TimeUnit.Days
                                      ),
                                      Blank()
                                  )
                              )
                          );

                          Set(
                              varTotalChecklists,
                              CountRows(colChecklistIndicadoresBase)
                          );

                          Set(
                              varChecklistsConformes,
                              CountRows(
                                  Filter(
                                      colChecklistIndicadoresBase,
                                      StatusGeralTexto = "Conforme"
                                  )
                              )
                          );

                          Set(
                              varChecklistsNaoConformes,
                              Max(
                                  0,
                                  varTotalChecklists - varChecklistsConformes
                              )
                          );

                          Set(
                              varPercChecklistsConformes,
                              If(
                                  varTotalChecklists = 0,
                                  Blank(),
                                  Round(
                                      varChecklistsConformes / varTotalChecklists * 100,
                                      0
                                  )
                              )
                          );

                          Clear(colUltimoChecklistSala);

                          ForAll(
                              Sort(
                                  Filter(
                                      colChecklistIndicadoresBase,
                                      !IsBlank(SalaTexto) &&
                                      !IsBlank(StatusGeralTexto)
                                  ),
                                  DataInspecao,
                                  SortOrder.Descending
                              ) As CkRow,

                              If(
                                  IsEmpty(
                                      Filter(
                                          colUltimoChecklistSala,
                                          Sala = CkRow.SalaTexto
                                      )
                                  ),

                                  Collect(
                                      colUltimoChecklistSala,
                                      {
                                          Sala: CkRow.SalaTexto,
                                          UltimoStatusGeral: CkRow.StatusGeralTexto
                                      }
                                  )
                              )
                          );

                          Set(
                              varTotalSalasEscopo,
                              CountRows(colUltimoChecklistSala)
                          );

                          Set(
                              varSemInspecaoEscopo,
                              varTotalSalasEscopo = 0
                          );

                          Set(
                              varSalasConformes,
                              CountRows(
                                  Filter(
                                      colUltimoChecklistSala,
                                      UltimoStatusGeral = "Conforme"
                                  )
                              )
                          );

                          Set(
                              varPercSalasConformes,
                              If(
                                  varTotalSalasEscopo = 0,
                                  Blank(),
                                  Round(
                                      varSalasConformes / varTotalSalasEscopo * 100,
                                      0
                                  )
                              )
                          );

                          Set(
                              varExecutadoChecklist,
                              CountRows(colChecklistTurnoGeral)
                          );

                          Set(
                              varAderenciaChecklist,
                              If(
                                  varPrevistoChecklist = 0,
                                  Blank(),
                                  Round(
                                      Min(
                                          100,
                                          varExecutadoChecklist / varPrevistoChecklist * 100
                                      ),
                                      0
                                  )
                              )
                          );

                          Clear(colChecklistAdmUnico);

                          ForAll(
                              colChecklistAdministrativo As CkAdm,

                              If(
                                  !IsBlank(CkAdm.SalaTexto) &&
                                  IsEmpty(
                                      Filter(
                                          colChecklistAdmUnico,
                                          ChaveAdm = CkAdm.SalaTexto & "_" & Text(CkAdm.QuinzenaAdm)
                                      )
                                  ),

                                  Collect(
                                      colChecklistAdmUnico,
                                      {
                                          Sala: CkAdm.SalaTexto,
                                          Quinzena: CkAdm.QuinzenaAdm,
                                          ChaveAdm: CkAdm.SalaTexto & "_" & Text(CkAdm.QuinzenaAdm),
                                          StatusGeral: CkAdm.StatusGeralTexto
                                      }
                                  )
                              )
                          );

                          Set(
                              varExecutadoChecklistAdm,
                              CountRows(colChecklistAdmUnico)
                          );

                          Set(
                              varAderenciaChecklistAdm,
                              If(
                                  varPrevistoChecklistAdm = 0,
                                  Blank(),
                                  Round(
                                      Min(
                                          100,
                                          varExecutadoChecklistAdm / varPrevistoChecklistAdm * 100
                                      ),
                                      0
                                  )
                              )
                          );

                          Set(
                              varTotalNCsPeriodo,
                              CountRows(colNCIndicadoresBase)
                          );

                          Set(
                              varNCsEncerradasPeriodo,
                              CountRows(
                                  Filter(
                                      colNCIndicadoresBase,
                                      StatusNCTexto = "Encerrada" &&
                                      !IsBlank(DiasTratamento)
                                  )
                              )
                          );

                          Set(
                              varNCsNaoEncerradasPeriodo,
                              Max(
                                  0,
                                  varTotalNCsPeriodo - varNCsEncerradasPeriodo
                              )
                          );

                          Set(
                              varTempoMedioTratamentoNC,
                              If(
                                  varTotalNCsPeriodo = 0,
                                  Blank(),
                                  If(
                                      varNCsEncerradasPeriodo = 0,
                                      Blank(),
                                      Round(
                                          Average(
                                              Filter(
                                                  colNCIndicadoresBase,
                                                  StatusNCTexto = "Encerrada" &&
                                                  !IsBlank(DiasTratamento)
                                              ),
                                              DiasTratamento
                                          ),
                                          1
                                      )
                                  )
                              )
                          );

                          ClearCollect(
                              colGraficoConformidade,
                              {
                                  Categoria: "Conformes",
                                  Valor: varChecklistsConformes,
                                  RotuloLegenda: "Conformes " &
                                      If(
                                          varTotalChecklists = 0,
                                          "0%",
                                          Text(
                                              Round(
                                                  varChecklistsConformes / varTotalChecklists * 100,
                                                  0
                                              ),
                                              "[$-pt-BR]0"
                                          ) & "%"
                                      ) &
                                      " (" &
                                      Text(
                                          varChecklistsConformes,
                                          "[$-pt-BR]0"
                                      ) &
                                      ")"
                              },
                              {
                                  Categoria: "Não conformes",
                                  Valor: varChecklistsNaoConformes,
                                  RotuloLegenda: "Não conformes " &
                                      If(
                                          varTotalChecklists = 0,
                                          "0%",
                                          Text(
                                              Round(
                                                  varChecklistsNaoConformes / varTotalChecklists * 100,
                                                  0
                                              ),
                                              "[$-pt-BR]0"
                                          ) & "%"
                                      ) &
                                      " (" &
                                      Text(
                                          varChecklistsNaoConformes,
                                          "[$-pt-BR]0"
                                      ) &
                                      ")"
                              }
                          );

                          Set(varBusyIndicadores, false);

                          Notify(
                              "✅ Indicadores atualizados com sucesso.",
                              NotificationType.Success
                          ),

                          Set(varBusyIndicadores, false);

                          Notify(
                              "❌ Erro ao atualizar indicadores. Verifique os campos 'DataCriacao ', StatusNC, SalaNC ou a conexão das listas.",
                              NotificationType.Error
                          )
                      )
                  )
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(16, 110, 190, 1)
            Size: =18
            Text: |-
              =If(
                  varBusyIndicadores,
                  "BUSCANDO...",
                  "🔍 Buscar"
              )
            Width: =242
            X: =1008
            Y: =125

                              Color: =Color.White
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: |-
                                =// TelaShelter - btnEnviarTelaShelter.DisplayMode
                                If(
                                    varBusy,
                                    DisplayMode.Disabled,
                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),
                                            IsBlank(DataCardValue24.Selected.Value),
                                            IsBlank(DataCardValue25.Selected.Value),
                                            IsBlank(DataCardValue26.Selected.Value),
                                            IsBlank(DataCardValue27.Selected.Value),
                                            IsBlank(DataCardValue28.Selected.Value),
                                            IsBlank(DataCardValue29.Selected.Value),
                                            IsBlank(DataCardValue30.Selected.Value),
                                            IsBlank(DataCardValue1.Selected.Value),
                                            IsBlank(DataCardValue2.Selected.Value)
                                        ),
                                        DisplayMode.Disabled,
                                        DisplayMode.Edit
                                    )
                                )
                              Fill: '=RGBA(0, 56, 168, 1) '
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =98
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(0, 90, 160, 1)
                              OnSelect: |-
                                =If(
                                    varBusy,
                                    Blank(),

                                    Set(varBusy, true);
                                    Set(varRodizioValidado, true);
                                    Set(
                                        varRegistroChecklistAtualizadoShelter,
                                        Defaults(Checklist_OrganizacaoPellet2025)
                                    );

                                    Clear(colRodizioSalaAtual);
                                    Clear(colNcShelter);
                                    Clear(colNCtemporarias);

                                    Set(
                                        varPessoaLogadaSP,
                                        {
                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims: "i:0#.f|membership|" & Lower(Coalesce(varUserEmail, User().Email)),
                                            DisplayName: Coalesce(varUserNome, User().FullName),
                                            Email: Lower(Coalesce(varUserEmail, User().Email)),
                                            Department: "",
                                            JobTitle: "",
                                            Picture: ""
                                        }
                                    );

                                    If(
                                        Or(
                                            IsBlank(varRegistroChecklist) || IsBlank(varRegistroChecklist.ID),
                                            IsBlank(DataCardValue24.Selected.Value),
                                            IsBlank(DataCardValue25.Selected.Value),
                                            IsBlank(DataCardValue1.Selected.Value),
                                            IsBlank(DataCardValue26.Selected.Value),
                                            IsBlank(DataCardValue27.Selected.Value),
                                            IsBlank(DataCardValue2.Selected.Value),
                                            IsBlank(DataCardValue28.Selected.Value),
                                            IsBlank(DataCardValue29.Selected.Value),
                                            IsBlank(DataCardValue30.Selected.Value)
                                        ),

                                        Notify(
                                            "❌ Preencha todos os campos obrigatórios.",
                                            NotificationType.Error
                                        );
                                        Set(varBusy, false),

                                        Set(
                                            varTemNC_Shelter,
                                            Or(
                                                DataCardValue24.Selected.Value = "Não Conforme",
                                                DataCardValue25.Selected.Value = "Não Conforme",
                                                DataCardValue1.Selected.Value = "Não Conforme",
                                                DataCardValue26.Selected.Value = "Não Conforme",
                                                DataCardValue27.Selected.Value = "Não Conforme",
                                                DataCardValue2.Selected.Value = "Não Conforme",
                                                DataCardValue28.Selected.Value = "Não Conforme",
                                                DataCardValue29.Selected.Value = "Não Conforme",
                                                DataCardValue30.Selected.Value = "Não Conforme"
                                            )
                                        );

                                        ClearCollect(
                                            colNcShelter,
                                            Filter(
                                                Table(
                                                    {
                                                        ItemChecklistOrigem: "CilindrosComCorrente",
                                                        ItemNC: "Cilindros estão fixados com corrente de segurança?",
                                                        Valor: DataCardValue24.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "CilindrosComProtecao",
                                                        ItemNC: "Cilindros com reguladora ou proteção de válvula instaladas?",
                                                        Valor: DataCardValue25.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "FerramentasOk_Shelter",
                                                        ItemNC: "Ferramentas estão identificadas conforme o padrão visual do ciclo vigente?",
                                                        Valor: DataCardValue1.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "ArmarFerramOrganizado",
                                                        ItemNC: "Armário de ferramentas está organizado?",
                                                        Valor: DataCardValue26.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "VazamentoCalhaNecessitaLimpeza",
                                                        ItemNC: "Vazamentos em calhas de chuva estão ausentes?",
                                                        Valor: DataCardValue27.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "ProdutosFracionadosOk",
                                                        ItemNC: "Produtos fracionados estão com etiqueta de identificação devidamente preenchida?",
                                                        Valor: DataCardValue2.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "VazamentoEmContencao",
                                                        ItemNC: "Há ausência de vazamento de reagente dentro das contenções?",
                                                        Valor: DataCardValue28.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "PainelAnalisadorFechado",
                                                        ItemNC: "Painéis dos analisadores estão devidamente fechados?",
                                                        Valor: DataCardValue29.Selected.Value
                                                    },
                                                    {
                                                        ItemChecklistOrigem: "TempShelterAdequada",
                                                        ItemNC: "Temperatura do shelter está adequada?",
                                                        Valor: DataCardValue30.Selected.Value
                                                    }
                                                ),
                                                Valor = "Não Conforme"
                                            )
                                        );

                                        Set(
                                            varQtdNCShelter,
                                            CountRows(colNcShelter)
                                        );

                                        If(
                                            varTemNC_Shelter,

                                            ClearCollect(
                                                colRodizioSalaAtual,
                                                Filter(
                                                    RodizioPlanejado,
                                                    Sala.Value = varRegistroChecklist.Sala.Value &&
                                                    Publicado = true &&
                                                    StatusRodizio.Value = "Ativo" &&
                                                    InicioRodizio <= Today() &&
                                                    FimRodizio >= Today()
                                                )
                                            );

                                            If(
                                                CountRows(colRodizioSalaAtual) > 1,

                                                Notify(
                                                    "❌ Existe mais de um rodízio ativo publicado para esta sala. Corrija a lista RodizioPlanejado antes de continuar.",
                                                    NotificationType.Error
                                                );
                                                Set(varRodizioValidado, false),

                                                CountRows(colRodizioSalaAtual) = 0,

                                                Set(varRodizioSala, Blank());
                                                Set(varResponsaveisNCShelter, Table(varPessoaLogadaSP));
                                                Notify(
                                                    "⚠️ Nenhum rodízio ativo publicado foi encontrado. A NC será registrada provisoriamente para o usuário logado.",
                                                    NotificationType.Warning
                                                ),

                                                Set(varRodizioSala, First(colRodizioSalaAtual));
                                                If(
                                                    CountRows(varRodizioSala.ResponsavelSala) = 0,
                                                    Set(varResponsaveisNCShelter, Table(varPessoaLogadaSP));
                                                    Notify(
                                                        "⚠️ Rodízio ativo encontrado, mas sem responsável cadastrado. A NC será registrada provisoriamente para o usuário logado.",
                                                        NotificationType.Warning
                                                    ),
                                                    Set(varResponsaveisNCShelter, varRodizioSala.ResponsavelSala)
                                                )
                                            );

                                            If(
                                                varRodizioValidado,
                                                ClearCollect(
                                                    colNCtemporarias,
                                                    ForAll(
                                                        colNcShelter As r,
                                                        {
                                                            ItemChecklistOrigem: r.ItemChecklistOrigem,
                                                            ItemNC: r.ItemNC,
                                                            Pilar: LookUp(
                                                                colMapaItens As mapa,
                                                                mapa.Campo = r.ItemChecklistOrigem,
                                                                mapa.Pilar
                                                            ),
                                                            OrigemNC: "Checklist",
                                                            SalaNC: varRegistroChecklist.Sala.Value,
                                                            ChecklistID: varRegistroChecklist.ID,
                                                            Ciclo: Coalesce(varRegistroChecklist.Ciclo, varCicloAtual),
                                                            DataCriacao: Now(),
                                                            ResponsavelSala: If(
                                                                IsEmpty(varResponsaveisNCShelter),
                                                                Table(varPessoaLogadaSP),
                                                                varResponsaveisNCShelter
                                                            ),
                                                            DescricaoNC: ""
                                                        }
                                                    )
                                                )
                                            )
                                        );

                                        If(
                                            !varRodizioValidado,
                                            Set(varBusy, false),

                                            Set(
                                                varStatusGeralShelter,
                                                If(
                                                    Coalesce(varRegistroChecklist.StatusGeral.Value, "") = "Crítico",
                                                    "Crítico",
                                                    If(
                                                        Coalesce(varRegistroChecklist.StatusGeral.Value, "") = "Atenção" ||
                                                        varTemNC_Shelter,
                                                        "Atenção",
                                                        "Conforme"
                                                    )
                                                )
                                            );

                                            Set(
                                                varRegistroChecklistAtualizadoShelter,
                                                IfError(
                                                    Patch(
                                                        Checklist_OrganizacaoPellet2025,
                                                        varRegistroChecklist,
                                                        {
                                                            CilindrosComCorrente: {
                                                                Value: DataCardValue24.Selected.Value
                                                            },
                                                            CilindrosComProtecao: {
                                                                Value: DataCardValue25.Selected.Value
                                                            },
                                                            FerramentasOk: {
                                                                Value: DataCardValue1.Selected.Value
                                                            },
                                                            ArmarFerramOrganizado: {
                                                                Value: DataCardValue26.Selected.Value
                                                            },
                                                            VazamentoCalhaNecessitaLimpeza: {
                                                                Value: DataCardValue27.Selected.Value
                                                            },
                                                            ProdutosFracionadosOk: {
                                                                Value: DataCardValue2.Selected.Value
                                                            },
                                                            VazamentoEmContencao: {
                                                                Value: DataCardValue28.Selected.Value
                                                            },
                                                            PainelAnalisadorFechado: {
                                                                Value: DataCardValue29.Selected.Value
                                                            },
                                                            TempShelterAdequada: {
                                                                Value: DataCardValue30.Selected.Value
                                                            },
                                                            StatusGeral: {
                                                                Value: varStatusGeralShelter
                                                            },
                                                            StatusNC: If(
                                                                varTemNC_Shelter ||
                                                                Coalesce(varRegistroChecklist.StatusNC.Value, "") = "Pendente",
                                                                {
                                                                    Value: "Pendente"
                                                                },
                                                                {
                                                                    Value: "Concluído"
                                                                }
                                                            )
                                                        }
                                                    ),
                                                    Defaults(Checklist_OrganizacaoPellet2025)
                                                )
                                            );

                                            If(
                                                IsBlank(varRegistroChecklistAtualizadoShelter.ID),
                                                Notify(
                                                    "❌ Erro ao salvar checklist do Shelter. Verifique conexão ou permissão.",
                                                    NotificationType.Error
                                                );
                                                Set(varBusy, false),

                                                Set(varRegistroChecklist, varRegistroChecklistAtualizadoShelter);

                                                If(
                                                    varTemNC_Shelter,
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaNCShelter,
                                                        ScreenTransition.Fade
                                                    ),
                                                    ResetForm(Form_Shelter);
                                                    Set(varBusy, false);
                                                    Navigate(
                                                        TelaFinal,
                                                        ScreenTransition.Fade
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =24
                              Text: ="ENVIAR CHECK LIST"
                              Width: =1233
                              X: =30
                              Y: =26
